<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StepCode - 개념 출력</title>
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="assets/css/theory.print.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/prismjs/plugins/line-numbers/prism-line-numbers.css"
    />
  </head>
  <body>
    <div class="theory-print-toolbar no-print">
      <div class="tool-left">
        <a id="tp-back-link" class="tp-link" href="theory.html">← 개념으로</a>
        <div class="tp-title-wrap">
          <div id="tp-title" class="tp-title">개념 출력</div>
          <div id="tp-subtitle" class="tp-subtitle"></div>
        </div>
      </div>

      <div class="tool-right">
        <label class="tp-tool">
          언어 예시
          <select id="tp-lang-select">
            <option value="all">전체</option>
            <option value="python">Python</option>
            <option value="c">C</option>
            <option value="java">Java</option>
            <option value="csharp">C#</option>
          </select>
        </label>
        <label class="tp-tool">
          학년 표시
          <select id="tp-audience-select">
            <option value="all">모두</option>
            <option value="elementary">초등만</option>
            <option value="middle">중등만</option>
            <option value="high">고등만</option>
          </select>
        </label>
        <label class="tp-tool">
          표시 대상
          <select id="tp-view-select">
            <option value="student">학생용</option>
            <option value="teacher">교사용</option>
            <option value="all">모두</option>
          </select>
        </label>
        <label class="tp-tool">
          레이아웃
          <select id="tp-layout-select">
            <option value="single">1열</option>
            <option value="double">2열</option>
          </select>
        </label>
        <div id="tp-concept-toggle" class="tp-concept-toggle"></div>
        <button id="tp-apply-btn" type="button">적용</button>
        <button id="tp-print-btn" class="primary" type="button">인쇄 / PDF 저장</button>
      </div>
    </div>
    <div id="tp-batch-controls" class="tp-batch-controls no-print" hidden></div>

    <main id="theory-print-root" class="theory-print-root">불러오는 중...</main>

    <script src="https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-c.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-java.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-csharp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/services/problemService.local.js"></script>
    <script src="assets/js/theory.print.js"></script>
  </body>
</html>

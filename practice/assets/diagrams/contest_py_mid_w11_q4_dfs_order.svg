<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440">
  <defs>
    <style>
      .title { font: 18px sans-serif; fill: #111; }
      .sub { font: 13px sans-serif; fill: #333; }
      .axis { font: 12px sans-serif; fill: #333; }
      .cell { stroke: #222; stroke-width: 1.2; }
      .zero { fill: #e9e9e9; }
      .one  { fill: #d7f5dc; }
      .num { font: 14px sans-serif; fill: #111; font-weight: 700; }
      .start { stroke: #d35400; stroke-width: 4; }
      .legend { font: 12px sans-serif; fill: #111; }
    </style>
  </defs>

  <text x="20" y="28" class="title">Week11 (Middle) Q4: DFS Visit Order on 6x6 Grid</text>
  <text x="20" y="50" class="sub">Numbers show the first-visit order (visit#). Start cell is highlighted. Neighbor order: up, down, left, right.</text>

  <!-- Grid origin -->
  <g transform="translate(40,80)">
    <!-- axis labels -->
    <text x="-22" y="24" class="axis">p</text>
    <text x="8" y="-14" class="axis">q</text>
    <!-- column labels q=0..5 -->
    <text x="30"  y="-10" class="axis" text-anchor="middle">0</text>
    <text x="90"  y="-10" class="axis" text-anchor="middle">1</text>
    <text x="150" y="-10" class="axis" text-anchor="middle">2</text>
    <text x="210" y="-10" class="axis" text-anchor="middle">3</text>
    <text x="270" y="-10" class="axis" text-anchor="middle">4</text>
    <text x="330" y="-10" class="axis" text-anchor="middle">5</text>
    <!-- row labels p=0..5 -->
    <text x="-10" y="30"  class="axis" text-anchor="end">0</text>
    <text x="-10" y="90"  class="axis" text-anchor="end">1</text>
    <text x="-10" y="150" class="axis" text-anchor="end">2</text>
    <text x="-10" y="210" class="axis" text-anchor="end">3</text>
    <text x="-10" y="270" class="axis" text-anchor="end">4</text>
    <text x="-10" y="330" class="axis" text-anchor="end">5</text>

    <!-- cell size 60 -->
    <!-- Row 0: 000100 -->
    <rect class="cell zero" x="0"   y="0" width="60" height="60"/>
    <rect class="cell zero" x="60"  y="0" width="60" height="60"/>
    <rect class="cell zero" x="120" y="0" width="60" height="60"/>
    <rect class="cell one start" x="180" y="0" width="60" height="60"/><text class="num" x="210" y="36" text-anchor="middle">1</text>
    <rect class="cell zero" x="240" y="0" width="60" height="60"/>
    <rect class="cell zero" x="300" y="0" width="60" height="60"/>

    <!-- Row 1: 101101 -->
    <rect class="cell one" x="0"   y="60" width="60" height="60"/><text class="num" x="30"  y="96" text-anchor="middle">13</text>
    <rect class="cell zero" x="60"  y="60" width="60" height="60"/>
    <rect class="cell one" x="120" y="60" width="60" height="60"/><text class="num" x="150" y="96" text-anchor="middle">6</text>
    <rect class="cell one" x="180" y="60" width="60" height="60"/><text class="num" x="210" y="96" text-anchor="middle">2</text>
    <rect class="cell zero" x="240" y="60" width="60" height="60"/>
    <rect class="cell one" x="300" y="60" width="60" height="60"/><text class="num" x="330" y="96" text-anchor="middle">22</text>

    <!-- Row 2: 111111 -->
    <rect class="cell one" x="0"   y="120" width="60" height="60"/><text class="num" x="30"  y="156" text-anchor="middle">12</text>
    <rect class="cell one" x="60"  y="120" width="60" height="60"/><text class="num" x="90"  y="156" text-anchor="middle">7</text>
    <rect class="cell one" x="120" y="120" width="60" height="60"/><text class="num" x="150" y="156" text-anchor="middle">5</text>
    <rect class="cell one" x="180" y="120" width="60" height="60"/><text class="num" x="210" y="156" text-anchor="middle">3</text>
    <rect class="cell one" x="240" y="120" width="60" height="60"/><text class="num" x="270" y="156" text-anchor="middle">20</text>
    <rect class="cell one" x="300" y="120" width="60" height="60"/><text class="num" x="330" y="156" text-anchor="middle">21</text>

    <!-- Row 3: 110100 -->
    <rect class="cell one" x="0"   y="180" width="60" height="60"/><text class="num" x="30"  y="216" text-anchor="middle">11</text>
    <rect class="cell one" x="60"  y="180" width="60" height="60"/><text class="num" x="90"  y="216" text-anchor="middle">8</text>
    <rect class="cell zero" x="120" y="180" width="60" height="60"/>
    <rect class="cell one" x="180" y="180" width="60" height="60"/><text class="num" x="210" y="216" text-anchor="middle">4</text>
    <rect class="cell zero" x="240" y="180" width="60" height="60"/>
    <rect class="cell zero" x="300" y="180" width="60" height="60"/>

    <!-- Row 4: 111011 -->
    <rect class="cell one" x="0"   y="240" width="60" height="60"/><text class="num" x="30"  y="276" text-anchor="middle">10</text>
    <rect class="cell one" x="60"  y="240" width="60" height="60"/><text class="num" x="90"  y="276" text-anchor="middle">9</text>
    <rect class="cell one" x="120" y="240" width="60" height="60"/><text class="num" x="150" y="276" text-anchor="middle">14</text>
    <rect class="cell zero" x="180" y="240" width="60" height="60"/>
    <rect class="cell one" x="240" y="240" width="60" height="60"/><text class="num" x="270" y="276" text-anchor="middle">18</text>
    <rect class="cell one" x="300" y="240" width="60" height="60"/><text class="num" x="330" y="276" text-anchor="middle">19</text>

    <!-- Row 5: 001110 -->
    <rect class="cell zero" x="0"   y="300" width="60" height="60"/>
    <rect class="cell zero" x="60"  y="300" width="60" height="60"/>
    <rect class="cell one" x="120" y="300" width="60" height="60"/><text class="num" x="150" y="336" text-anchor="middle">15</text>
    <rect class="cell one" x="180" y="300" width="60" height="60"/><text class="num" x="210" y="336" text-anchor="middle">16</text>
    <rect class="cell one" x="240" y="300" width="60" height="60"/><text class="num" x="270" y="336" text-anchor="middle">17</text>
    <rect class="cell zero" x="300" y="300" width="60" height="60"/>
  </g>

  <!-- Legend -->
  <g transform="translate(440,110)">
    <rect x="0" y="0" width="300" height="160" fill="#fff" stroke="#bbb"/>
    <text x="14" y="26" class="legend">Legend</text>
    <rect x="14" y="42" width="22" height="22" class="cell one"/><text x="46" y="58" class="legend">cell = '1'</text>
    <rect x="14" y="72" width="22" height="22" class="cell zero"/><text x="46" y="88" class="legend">cell = '0'</text>
    <rect x="14" y="102" width="22" height="22" class="cell one start"/><text x="46" y="118" class="legend">start (first scanned '1')</text>
    <text x="14" y="146" class="legend">numbers = DFS first-visit order</text>
  </g>
</svg>


<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="360" viewBox="0 0 620 360">
  <defs>
    <style>
      .title { font: 16px sans-serif; fill: #111; }
      .txt { font: 13px sans-serif; fill: #111; }
      .cell { fill: #fafafa; stroke: #333; stroke-width: 1; }
      .head { fill: #e9f6ff; }
      .arrow { stroke: #c0392b; stroke-width: 2.5; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="20" y="28" class="title">Week08 Q4: DP table for f(m,n)</text>
  <text x="20" y="50" class="txt">Each cell uses left (m,n-1), up (m-1,n), and diag-up-left (m-1,n-1).</text>

  <!-- Table 4x4 (m,n = 0..3), cell size 70 -->
  <g transform="translate(20,80)">
    <!-- headers -->
    <rect class="cell head" x="0" y="0" width="70" height="40"/><text class="txt" x="35" y="26" text-anchor="middle">m\\n</text>
    <rect class="cell head" x="70" y="0" width="70" height="40"/><text class="txt" x="105" y="26" text-anchor="middle">0</text>
    <rect class="cell head" x="140" y="0" width="70" height="40"/><text class="txt" x="175" y="26" text-anchor="middle">1</text>
    <rect class="cell head" x="210" y="0" width="70" height="40"/><text class="txt" x="245" y="26" text-anchor="middle">2</text>
    <rect class="cell head" x="280" y="0" width="70" height="40"/><text class="txt" x="315" y="26" text-anchor="middle">3</text>

    <!-- row labels -->
    <rect class="cell head" x="0" y="40" width="70" height="70"/><text class="txt" x="35" y="82" text-anchor="middle">0</text>
    <rect class="cell head" x="0" y="110" width="70" height="70"/><text class="txt" x="35" y="152" text-anchor="middle">1</text>
    <rect class="cell head" x="0" y="180" width="70" height="70"/><text class="txt" x="35" y="222" text-anchor="middle">2</text>
    <rect class="cell head" x="0" y="250" width="70" height="70"/><text class="txt" x="35" y="292" text-anchor="middle">3</text>

    <!-- values -->
    <!-- m=0 -->
    <rect class="cell" x="70"  y="40" width="70" height="70"/><text class="txt" x="105" y="82" text-anchor="middle">1</text>
    <rect class="cell" x="140" y="40" width="70" height="70"/><text class="txt" x="175" y="82" text-anchor="middle">1</text>
    <rect class="cell" x="210" y="40" width="70" height="70"/><text class="txt" x="245" y="82" text-anchor="middle">1</text>
    <rect class="cell" x="280" y="40" width="70" height="70"/><text class="txt" x="315" y="82" text-anchor="middle">1</text>
    <!-- m=1 -->
    <rect class="cell" x="70"  y="110" width="70" height="70"/><text class="txt" x="105" y="152" text-anchor="middle">1</text>
    <rect class="cell" x="140" y="110" width="70" height="70"/><text class="txt" x="175" y="152" text-anchor="middle">3</text>
    <rect class="cell" x="210" y="110" width="70" height="70"/><text class="txt" x="245" y="152" text-anchor="middle">5</text>
    <rect class="cell" x="280" y="110" width="70" height="70"/><text class="txt" x="315" y="152" text-anchor="middle">7</text>
    <!-- m=2 -->
    <rect class="cell" x="70"  y="180" width="70" height="70"/><text class="txt" x="105" y="222" text-anchor="middle">1</text>
    <rect class="cell" x="140" y="180" width="70" height="70"/><text class="txt" x="175" y="222" text-anchor="middle">5</text>
    <rect class="cell" x="210" y="180" width="70" height="70"/><text class="txt" x="245" y="222" text-anchor="middle">13</text>
    <rect class="cell" x="280" y="180" width="70" height="70"/><text class="txt" x="315" y="222" text-anchor="middle">25</text>
    <!-- m=3 -->
    <rect class="cell" x="70"  y="250" width="70" height="70"/><text class="txt" x="105" y="292" text-anchor="middle">1</text>
    <rect class="cell" x="140" y="250" width="70" height="70"/><text class="txt" x="175" y="292" text-anchor="middle">7</text>
    <rect class="cell" x="210" y="250" width="70" height="70"/><text class="txt" x="245" y="292" text-anchor="middle">25</text>
    <rect class="cell" x="280" y="250" width="70" height="70"/><text class="txt" x="315" y="292" text-anchor="middle">63</text>

    <!-- arrows into (3,3) cell center at (315, 292) -->
    <path class="arrow" d="M 315 222 L 315 278"/> <!-- from (2,3) -->
    <path class="arrow" d="M 245 292 L 301 292"/> <!-- from (3,2) -->
    <path class="arrow" d="M 245 222 L 304 281"/> <!-- from (2,2) -->
  </g>
</svg>


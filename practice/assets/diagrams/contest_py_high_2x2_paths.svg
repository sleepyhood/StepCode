<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="280" viewBox="0 0 520 280">
  <defs>
    <style>
      .title { font: 16px sans-serif; fill: #111; }
      .txt { font: 13px sans-serif; fill: #111; }
      .cell { fill: #f7f7ff; stroke: #333; stroke-width: 2; rx: 10; ry: 10; }
      .arrow { stroke: #444; stroke-width: 3; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="20" y="28" class="title">2x2 Grid Moves (4-neighbor)</text>
  <text x="20" y="50" class="txt">Start anywhere, move 2 times, concatenate digits (length 3).</text>

  <g transform="translate(120,80)">
    <!-- cells -->
    <rect class="cell" x="0"   y="0"   width="120" height="90"/><text class="title" x="60" y="56" text-anchor="middle">1</text>
    <rect class="cell" x="140" y="0"   width="120" height="90"/><text class="title" x="200" y="56" text-anchor="middle">2</text>
    <rect class="cell" x="0"   y="110" width="120" height="90"/><text class="title" x="60" y="166" text-anchor="middle">1</text>
    <rect class="cell" x="140" y="110" width="120" height="90"/><text class="title" x="200" y="166" text-anchor="middle">3</text>

    <!-- arrows (bidirectional shown by two arrows) -->
    <path class="arrow" d="M 120 45 L 140 45"/>
    <path class="arrow" d="M 140 155 L 120 155"/>
    <path class="arrow" d="M 60 90 L 60 110"/>
    <path class="arrow" d="M 200 110 L 200 90"/>
  </g>
</svg>


<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230">
  <defs>
    <style>
      .title { font: 16px sans-serif; fill: #111; }
      .txt { font: 13px sans-serif; fill: #111; }
      .box { fill: #fff7e6; stroke: #b9770e; stroke-width: 2; rx: 12; ry: 12; }
      .arrow { stroke: #444; stroke-width: 2; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="20" y="28" class="title">Week12 Recursion Trace: f(7,10)</text>
  <text x="20" y="50" class="txt">Call chain decreases a by 2 and increases b by 1 each step.</text>

  <g transform="translate(20,80)">
    <rect class="box" x="0"   y="0" width="140" height="70"/>
    <text class="txt" x="70" y="28" text-anchor="middle">f(7,10)</text>
    <text class="txt" x="70" y="50" text-anchor="middle">= 10 * ...</text>

    <path class="arrow" d="M 140 35 L 170 35"/>

    <rect class="box" x="170" y="0" width="140" height="70"/>
    <text class="txt" x="240" y="28" text-anchor="middle">f(5,11)</text>
    <text class="txt" x="240" y="50" text-anchor="middle">= 11 * ...</text>

    <path class="arrow" d="M 310 35 L 340 35"/>

    <rect class="box" x="340" y="0" width="140" height="70"/>
    <text class="txt" x="410" y="28" text-anchor="middle">f(3,12)</text>
    <text class="txt" x="410" y="50" text-anchor="middle">= 12 * ...</text>

    <path class="arrow" d="M 480 35 L 510 35"/>

    <rect class="box" x="510" y="0" width="140" height="70"/>
    <text class="txt" x="580" y="28" text-anchor="middle">f(1,13)</text>
    <text class="txt" x="580" y="50" text-anchor="middle">= 13 * ...</text>

    <path class="arrow" d="M 650 35 L 680 35"/>

    <rect class="box" x="680" y="0" width="160" height="70"/>
    <text class="txt" x="760" y="28" text-anchor="middle">f(-1,14)</text>
    <text class="txt" x="760" y="50" text-anchor="middle">base: 1</text>
  </g>
</svg>


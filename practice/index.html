<!-- practice/index.html -->
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StepCode - 문제 라이브러리</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <div class="brand-row">
          <div class="brand-badge">연습 스튜디오</div>
          <h1>StepCode</h1>
        </div>
        <p class="app-subtitle">
          실행 추적 · 객관식 · 코드 수정 - 정답보다 습관을 만드세요.
        </p>
        <div class="hero-rail">
          <div class="hero-card">
            <p class="hero-title">빠르게 시작</p>
            <p class="hero-body">트랙을 고르고 짧은 라운드를 반복해 보세요.</p>
          </div>
          <div class="hero-card">
            <p class="hero-title">실전으로 학습</p>
            <p class="hero-body">짧은 문제, 즉시 피드백, 별도 설정 없이 진행합니다.</p>
          </div>
          <div class="hero-card">
            <p class="hero-title">학습 깊이 확장</p>
            <p class="hero-body">기초와 도전을 섞어 탄탄한 실력을 만드세요.</p>
          </div>
        </div>
      </header>

      <main id="list-root">
        <!-- index.js에서 카테고리/세트 목록 렌더 -->
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/services/problemService.local.js"></script>
    <script src="assets/js/index.js"></script>
  </body>
</html>

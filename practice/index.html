<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StepCode - 문제 라이브러리</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body>
    <div class="app-container index-shell">
      <header class="app-header index-hero">
        <div class="hero-copy">
          <div class="hero-eyebrow">STEPCODE PRACTICE</div>
          <h1>
            지금 할 파트를
            <br />
            고르고 시작하세요
          </h1>
          <p class="app-subtitle">
            트랙과 언어를 선택하면, 개념과 연결된 문제 세트를 바로 볼 수 있습니다.
          </p>
          <div class="hero-actions">
            <a id="hero-start-link" class="hero-action hero-action--primary" href="#library-shell">학습 시작</a>
            <a id="hero-browse-link" class="hero-action hero-action--secondary" href="#library-shell">파트 둘러보기</a>
          </div>
          <div class="hero-proof-row" aria-label="핵심 특성">
            <span class="hero-proof-pill">개념-문제 연결</span>
            <span class="hero-proof-pill">짧은 라운드</span>
            <span class="hero-proof-pill">즉시 진입</span>
          </div>
        </div>

        <aside class="hero-glance" id="overview-panel" aria-label="StepCode 한눈에 보기">
          <div class="hero-glance-card">
            <p class="hero-glance-kicker">빠르게 살펴보기</p>
            <ul class="hero-glance-list">
              <li>
                <strong>개념과 연결</strong>
                <span>개념 문서와 문제 세트를 같은 흐름에서 확인합니다.</span>
              </li>
              <li>
                <strong>짧은 회차</strong>
                <span>기초와 도전을 나눠 한 회차씩 가볍게 진행합니다.</span>
              </li>
              <li>
                <strong>바로 시작</strong>
                <span>현재 선택한 트랙에서 바로 들어갈 수 있습니다.</span>
              </li>
            </ul>
            <div class="hero-live-summary">
              <div class="hero-live-label">현재 기본 보기</div>
              <div class="hero-live-value">
                <span id="hero-live-track">언어 수업</span>
                <span class="hero-live-sep">/</span>
                <span id="hero-live-lang">Python</span>
              </div>
            </div>
          </div>
        </aside>
      </header>

      <main id="library-shell" class="index-main">
        <section id="list-root" aria-live="polite">
          <!-- index.js에서 필터/카드 목록 렌더 -->
        </section>
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/services/problemService.local.js"></script>
    <script src="assets/js/index.js"></script>
  </body>
</html>

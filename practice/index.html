<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StepCode - Problem Library</title>
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <div class="brand-row">
          <div class="brand-badge">Practice Studio</div>
          <h1>StepCode</h1>
        </div>
        <p class="app-subtitle">
          Trace execution · MCQ · code edits — build habits, not just answers.
        </p>
        <div class="hero-rail">
          <div class="hero-card">
            <p class="hero-title">Start fast</p>
            <p class="hero-body">Pick a track, complete a short round, repeat.</p>
          </div>
          <div class="hero-card">
            <p class="hero-title">Learn by doing</p>
            <p class="hero-body">Short prompts, immediate feedback, zero setup.</p>
          </div>
          <div class="hero-card">
            <p class="hero-title">Track depth</p>
            <p class="hero-body">Mix basics and challenges to build resilience.</p>
          </div>
        </div>
      </header>

      <main id="list-root">
        <!-- index.js에서 카테고리/세트 목록 렌더 -->
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/services/problemService.local.js"></script>
    <script src="assets/js/index.js"></script>
  </body>

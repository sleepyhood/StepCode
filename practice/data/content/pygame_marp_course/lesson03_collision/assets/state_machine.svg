<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 -->
  <rect width="400" height="200" fill="#f8fafc" rx="12"/>
  
  <!-- State: Playing -->
  <rect x="40" y="60" width="120" height="80" rx="15" fill="#635bff" fill-opacity="0.1" stroke="#635bff" stroke-width="3"/>
  <text x="100" y="105" font-family="Pretendard, sans-serif" font-size="16" font-weight="bold" fill="#1e40af" text-anchor="middle">PLAYING</text>
  
  <!-- State: Game Over -->
  <rect x="240" y="60" width="120" height="80" rx="15" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="3"/>
  <text x="300" y="105" font-family="Pretendard, sans-serif" font-size="16" font-weight="bold" fill="#991b1b" text-anchor="middle">GAME OVER</text>
  
  <!-- Transition: Playing -> Game Over (Collision) -->
  <path d="M165 85 L235 85" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="75" font-family="Pretendard, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Collision!</text>
  
  <!-- Transition: Game Over -> Playing (Restart) -->
  <path d="M235 115 L165 115" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="135" font-family="Pretendard, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Press 'R' (Reset)</text>
  
  <!-- 화살표 정의 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
  </defs>
</svg>

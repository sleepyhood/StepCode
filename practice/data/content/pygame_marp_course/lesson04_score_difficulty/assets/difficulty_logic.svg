<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 -->
  <rect width="400" height="200" fill="#f8fafc" rx="12"/>
  
  <!-- 축 -->
  <line x1="50" y1="160" x2="350" y2="160" stroke="#94a3b8" stroke-width="2"/> <!-- X축 (Score) -->
  <line x1="50" y1="160" x2="50" y2="40" stroke="#94a3b8" stroke-width="2"/>  <!-- Y축 (Level) -->
  
  <text x="350" y="175" font-family="Pretendard, sans-serif" font-size="10" fill="#64748b" text-anchor="end">Score →</text>
  <text x="45" y="40" font-family="Pretendard, sans-serif" font-size="10" fill="#64748b" text-anchor="end">Level ↑</text>
  
  <!-- 계단식 그래프 -->
  <path d="M50 160 L100 160 L100 130 L150 130 L150 100 L200 100 L200 70 L250 70" fill="none" stroke="#635bff" stroke-width="3"/>
  
  <!-- 지점 표시 -->
  <text x="100" y="175" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">300</text>
  <text x="150" y="175" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">600</text>
  <text x="200" y="175" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">900</text>
  
  <!-- 수식 강조 -->
  <rect x="260" y="40" width="120" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="320" y="60" font-family="monospace" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">difficulty =</text>
  <text x="320" y="78" font-family="monospace" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">score // 300</text>
  
  <text x="200" y="195" font-family="Pretendard, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">점수가 높아질수록 운석 속도가 가속됩니다!</text>
</svg>

  <rect x="70" y="190" width="280" height="350" rx="26" fill="#EEF5FB" stroke="#C8D9E8" stroke-width="2"/>
  <rect x="460" y="190" width="280" height="350" rx="26" fill="#F6F9FC" stroke="#D5E1EC" stroke-width="2"/>
  <rect x="850" y="190" width="280" height="350" rx="26" fill="#EEF8F2" stroke="#CBE5D4" stroke-width="2"/>

  <circle cx="110" cy="228" r="20" fill="#4F8CFF"/>
  <text x="145" y="238" fill="#17324D" font-size="30" font-weight="700" font-family="Pretendard, Noto Sans KR, sans-serif">입력 Input</text>

  <circle cx="500" cy="228" r="20" fill="#F2A14A"/>
  <text x="535" y="238" fill="#17324D" font-size="30" font-weight="700" font-family="Pretendard, Noto Sans KR, sans-serif">처리 Process</text>

  <circle cx="890" cy="228" r="20" fill="#39C47A"/>
  <text x="925" y="238" fill="#17324D" font-size="30" font-weight="700" font-family="Pretendard, Noto Sans KR, sans-serif">결과 Output</text>

  <rect x="110" y="286" width="200" height="90" rx="18" fill="#FFFFFF" stroke="#D3E2EF"/>
  <text x="142" y="334" fill="#17324D" font-size="28" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">keys</text>
  <text x="142" y="365" fill="#5C738B" font-size="19" font-family="Pretendard, Noto Sans KR, sans-serif">지금 눌린 키 정보</text>

  <text x="108" y="430" fill="#35506A" font-size="23" font-family="Pretendard, Noto Sans KR, sans-serif">- 왼쪽 키가 눌렸는지 본다</text>
  <text x="108" y="468" fill="#35506A" font-size="23" font-family="Pretendard, Noto Sans KR, sans-serif">- 오른쪽 키가 눌렸는지 본다</text>
  <text x="108" y="506" fill="#35506A" font-size="23" font-family="Pretendard, Noto Sans KR, sans-serif">- 함수 안으로 정보가 들어온다</text>

  <rect x="500" y="280" width="200" height="72" rx="16" fill="#FFFFFF" stroke="#D7E3EE"/>
  <text x="530" y="325" fill="#17324D" font-size="24" font-weight="700" font-family="Pretendard, Noto Sans KR, sans-serif">1. 좌우 이동</text>
  <rect x="500" y="372" width="200" height="72" rx="16" fill="#FFFFFF" stroke="#D7E3EE"/>
  <text x="530" y="417" fill="#17324D" font-size="24" font-weight="700" font-family="Pretendard, Noto Sans KR, sans-serif">2. 경계 제한</text>
  <text x="500" y="490" fill="#35506A" font-size="23" font-family="Pretendard, Noto Sans KR, sans-serif">- `ship_rect.x`를 바꾼다</text>
  <text x="500" y="528" fill="#35506A" font-size="23" font-family="Pretendard, Noto Sans KR, sans-serif">- `left/right`로 화면 밖 탈주를 막는다</text>

  <rect x="892" y="286" width="196" height="90" rx="18" fill="#FFFFFF" stroke="#CBE5D4"/>
  <text x="924" y="338" fill="#17324D" font-size="28" font-weight="700" font-family="Pretendard, Noto Sans KR, sans-serif">우주선 이동</text>
  <text x="924" y="368" fill="#5C738B" font-size="19" font-family="Pretendard, Noto Sans KR, sans-serif">좌우로 부드럽게 이동</text>
  <text x="890" y="430" fill="#35506A" font-size="23" font-family="Pretendard, Noto Sans KR, sans-serif">- 왼쪽 화살표: 왼쪽으로</text>
  <text x="890" y="468" fill="#35506A" font-size="23" font-family="Pretendard, Noto Sans KR, sans-serif">- 오른쪽 화살표: 오른쪽으로</text>
  <text x="890" y="506" fill="#35506A" font-size="23" font-family="Pretendard, Noto Sans KR, sans-serif">- 화면 밖으로는 못 나감</text>


  <path d="M805 345 L835 365 L805 385" fill="none" stroke="#8FA6BC" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="120" y="574" width="958" height="58" rx="18" fill="#F5F9FD" stroke="#D7E3EE"/>
  <text x="155" y="612" fill="#17324D" font-size="24" font-weight="700" font-family="Pretendard, Noto Sans KR, sans-serif">핵심: 오늘은 게임 전체가 아니라 `move_ship(keys)` 함수 하나만 완성하면 된다.</text>

<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 -->
  <rect width="400" height="250" fill="#f8fafc" rx="12"/>
  
  <!-- 순환 루프 표시 -->
  <path d="M200 40 A80 80 0 1 1 199 40" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-dasharray="8 4"/>
  <text x="200" y="130" font-family="Pretendard, sans-serif" font-size="14" font-weight="bold" fill="#94a3b8" text-anchor="middle">Infinite Loop</text>
  
  <!-- Step 1: Input -->
  <rect x="150" y="20" width="100" height="40" rx="8" fill="#635bff"/>
  <text x="200" y="45" font-family="Pretendard, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1. Input</text>
  
  <!-- Step 2: Logic -->
  <rect x="280" y="105" width="100" height="40" rx="8" fill="#3b82f6"/>
  <text x="330" y="130" font-family="Pretendard, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2. Move Logic</text>
  
  <!-- Step 3: Draw -->
  <rect x="150" y="190" width="100" height="40" rx="8" fill="#10b981"/>
  <text x="200" y="215" font-family="Pretendard, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3. Draw Screen</text>
  
  <!-- 연결 화살표 -->
  <!-- 1 -> 2 -->
  <path d="M255 45 Q330 45 330 100" fill="none" stroke="#635bff" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- 2 -> 3 -->
  <path d="M330 150 Q330 210 255 210" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- 3 -> 1 -->
  <path d="M145 210 Q70 210 70 125 Q70 45 145 45" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 화살표 촉 정의 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
  </defs>
  
  <!-- 하단 부연 설명 -->
  <text x="200" y="240" font-family="Pretendard, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">초당 60번 반복하며 애니메이션을 만듭니다.</text>
</svg>

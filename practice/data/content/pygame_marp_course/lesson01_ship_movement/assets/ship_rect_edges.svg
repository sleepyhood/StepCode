  <text x="155" y="610" fill="#17324D" font-size="24" font-weight="700" font-family="Pretendard, Noto Sans KR, sans-serif">left는 왼쪽 테두리, x는 시작 기준점, right는 오른쪽 테두리이다. 벽에 닿는지 볼 때는 left/right가 더 정확하다.</text>

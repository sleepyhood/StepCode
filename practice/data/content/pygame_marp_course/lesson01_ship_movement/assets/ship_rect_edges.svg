  <rect x="390" y="290" width="360" height="160" rx="24" fill="#25D0E5" stroke="#17324D" stroke-width="4"/>
  <text x="515" y="380" fill="#0F172A" font-size="32" font-weight="700" font-family="Pretendard, Noto Sans KR, sans-serif">ship_rect</text>

  <line x1="390" y1="250" x2="390" y2="490" stroke="#5B96FF" stroke-width="6"/>
  <line x1="480" y1="250" x2="480" y2="490" stroke="#F2A14A" stroke-width="6"/>

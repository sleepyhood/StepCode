<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="960" height="340" rx="20" fill="#F7FAFD"/>

  <!-- Dark track panel -->
  <rect x="10" y="10" width="940" height="200" rx="18" fill="#0F172A"/>

  <!-- Horizontal track line -->
  <line x1="60" y1="110" x2="900" y2="110" stroke="#5C738B" stroke-width="4"/>

  <!-- 0 and 800 labels -->
  <text x="30" y="148" fill="#F8FBFF" font-size="22" font-family="Consolas, monospace">0</text>
  <text x="850" y="148" fill="#F8FBFF" font-size="22" font-family="Consolas, monospace">800</text>

  <!-- Ships at x=280, 500, 720 (valid), 840 (out) -->
  <rect x="190" y="66" width="70" height="70" rx="12" fill="#25D0E5"/>
  <rect x="380" y="66" width="70" height="70" rx="12" fill="#25D0E5"/>
  <rect x="570" y="66" width="70" height="70" rx="12" fill="#25D0E5"/>
  <rect x="800" y="66" width="70" height="70" rx="12" fill="#25D0E5" opacity="0.4"/>

  <!-- X labels above ships -->
  <text x="185" y="52" fill="#8FB7FF" font-size="18" font-family="Consolas, monospace">x=280</text>
  <text x="375" y="52" fill="#8FB7FF" font-size="18" font-family="Consolas, monospace">x=500</text>
  <text x="565" y="52" fill="#8FB7FF" font-size="18" font-family="Consolas, monospace">x=720</text>
  <text x="798" y="52" fill="#FFB4B4" font-size="18" font-family="Consolas, monospace">x=840</text>

  <!-- Arrows between ships -->
  <line x1="268" y1="101" x2="375" y2="101" stroke="#F2A14A" stroke-width="6" stroke-linecap="round"/>
  <polygon points="370,93 386,101 370,109" fill="#F2A14A"/>

  <line x1="458" y1="101" x2="565" y2="101" stroke="#F2A14A" stroke-width="6" stroke-linecap="round"/>
  <polygon points="560,93 576,101 560,109" fill="#F2A14A"/>

  <line x1="648" y1="101" x2="795" y2="101" stroke="#F2A14A" stroke-width="6" stroke-linecap="round"/>
  <polygon points="790,93 806,101 790,109" fill="#F2A14A"/>

  <!-- Summary box -->
  <rect x="10" y="222" width="940" height="108" rx="16" fill="#FFFFFF" stroke="#D7E3EE" stroke-width="1.5"/>
  <text x="40" y="255" fill="#17324D" font-size="22" font-weight="700" font-family="Malgun Gothic, sans-serif">핵심 원인</text>
  <text x="40" y="284" fill="#46617B" font-size="19" font-family="Malgun Gothic, sans-serif">경계 조건이 없으면 오른쪽 키를 누를 때마다 ship_rect.x가 계속 커지고,</text>
  <text x="40" y="314" fill="#46617B" font-size="19" font-family="Malgun Gothic, sans-serif">결국 800을 넘어 화면 밖으로 사라진다.</text>
</svg>

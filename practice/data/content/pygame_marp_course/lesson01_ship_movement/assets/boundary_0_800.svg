<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 및 베이스라인 -->
  <rect width="400" height="200" fill="#f8fafc" rx="10"/>
  <line x1="50" y1="150" x2="350" y2="150" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4"/>
  
  <!-- 왼쪽 경계 (0) -->
  <line x1="50" y1="40" x2="50" y2="160" stroke="#ef4444" stroke-width="3"/>
  <text x="50" y="30" font-family="Pretendard, sans-serif" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle">0 (Left Wall)</text>
  
  <!-- 오른쪽 경계 (800) -->
  <line x1="350" y1="40" x2="350" y2="160" stroke="#ef4444" stroke-width="3"/>
  <text x="350" y="30" font-family="Pretendard, sans-serif" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle">800 (Right Wall)</text>
  
  <!-- 우주선 사각형 (Rect) -->
  <rect x="175" y="100" width="50" height="50" fill="#635bff" fill-opacity="0.2" stroke="#635bff" stroke-width="2"/>
  <path d="M200 110 L215 140 L185 140 Z" fill="#635bff"/> <!-- 간단한 우주선 아이콘 -->
  
  <!-- 센서 표시 -->
  <!-- Left Sensor -->
  <circle cx="175" cy="125" r="4" fill="#3b82f6"/>
  <text x="170" y="129" font-family="monospace" font-size="10" fill="#1e40af" text-anchor="end">.left</text>
  
  <!-- Right Sensor -->
  <circle cx="225" cy="125" r="4" fill="#3b82f6"/>
  <text x="230" y="129" font-family="monospace" font-size="10" fill="#1e40af" text-anchor="start">.right</text>
  
  <!-- 설명 텍스트 -->
  <text x="200" y="185" font-family="Pretendard, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">우주선의 테두리 센서가 벽에 닿았는지 확인합니다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="100%">
  <defs>
    <!-- 그림자 필터 -->
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <!-- 실체화(Realization / Implements) 빈 삼각 화살표 -->
    <marker id="realize-arrow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <polygon points="0 1, 12 6, 0 11" fill="#ffffff" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" />
    </marker>

    <!-- 폰트 스타일 -->
    <style>
      .cls-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; }
      .cls-stereo { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-style: italic; }
      .cls-method { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #334155; }
      .rel-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-style: italic; fill: #64748b; }
      .rel-line { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
    </style>
  </defs>

  <!-- ================= 관계선 (Implements) ================= -->
  <!-- Dog -> Soundable -->
  <path d="M 120 220 V 160 H 305 V 110" class="rel-line" marker-end="url(#realize-arrow)" />
  <text x="212" y="152" text-anchor="middle" class="rel-label">implements</text>

  <!-- Cat -> Soundable -->
  <path d="M 340 220 V 110" class="rel-line" marker-end="url(#realize-arrow)" />
  <text x="348" y="170" class="rel-label">implements</text>

  <!-- Duck -> Soundable -->
  <path d="M 560 220 V 160 H 375 V 110" class="rel-line" marker-end="url(#realize-arrow)" />
  <text x="468" y="152" text-anchor="middle" class="rel-label">implements</text>

  <!-- ================= 인터페이스: Soundable ================= -->
  <g id="class-Soundable" transform="translate(230, 25)" filter="url(#card-shadow)">
    <rect width="220" height="85" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" />
    <path d="M 0 6 A 6 6 0 0 1 6 0 H 214 A 6 6 0 0 1 220 6 V 50 H 0 Z" fill="#eef2ff" />
    <line x1="0" y1="50" x2="220" y2="50" stroke="#6366f1" stroke-width="1" />
    
    <text x="110" y="22" text-anchor="middle" class="cls-stereo" fill="#4f46e5">&lt;&lt;interface&gt;&gt;</text>
    <text x="110" y="40" text-anchor="middle" class="cls-title" fill="#1e1b4b">Soundable</text>
    <text x="16" y="72" class="cls-method">+ sound(int times) void</text>
  </g>

  <!-- ================= 클래스: Dog ================= -->
  <g id="class-Dog" transform="translate(25, 220)" filter="url(#card-shadow)">
    <rect width="190" height="70" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <path d="M 0 6 A 6 6 0 0 1 6 0 H 184 A 6 6 0 0 1 190 6 V 34 H 0 Z" fill="#f8fafc" />
    <line x1="0" y1="34" x2="190" y2="34" stroke="#cbd5e1" stroke-width="1" />
    
    <text x="95" y="23" text-anchor="middle" class="cls-title" fill="#0f172a">Dog</text>
    <text x="14" y="57" class="cls-method">+ sound(int times) void</text>
  </g>

  <!-- ================= 클래스: Cat ================= -->
  <g id="class-Cat" transform="translate(245, 220)" filter="url(#card-shadow)">
    <rect width="190" height="70" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <path d="M 0 6 A 6 6 0 0 1 6 0 H 184 A 6 6 0 0 1 190 6 V 34 H 0 Z" fill="#f8fafc" />
    <line x1="0" y1="34" x2="190" y2="34" stroke="#cbd5e1" stroke-width="1" />
    
    <text x="95" y="23" text-anchor="middle" class="cls-title" fill="#0f172a">Cat</text>
    <text x="14" y="57" class="cls-method">+ sound(int times) void</text>
  </g>

  <!-- ================= 클래스: Duck ================= -->
  <g id="class-Duck" transform="translate(465, 220)" filter="url(#card-shadow)">
    <rect width="190" height="70" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <path d="M 0 6 A 6 6 0 0 1 6 0 H 184 A 6 6 0 0 1 190 6 V 34 H 0 Z" fill="#f8fafc" />
    <line x1="0" y1="34" x2="190" y2="34" stroke="#cbd5e1" stroke-width="1" />
    
    <text x="95" y="23" text-anchor="middle" class="cls-title" fill="#0f172a">Duck</text>
    <text x="14" y="57" class="cls-method">+ sound(int times) void</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650">
  <defs>
    <filter id="strongShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <style>
      .bg { fill: #fcfcfc; }
      .card { fill: #ffffff; stroke: #d1d1d1; stroke-width: 1.5; }
      .step-tag { font-family: 'Pretendard', sans-serif; font-size: 19px; font-weight: 800; fill: #222; }
      .label-text { font-family: 'Pretendard', sans-serif; font-size: 15px; font-weight: 700; fill: #444; }
      .dim-line { stroke: #555; stroke-width: 2; marker-end: url(#arrow); marker-start: url(#arrow); }
      .grid-line { stroke: #e5e5e5; stroke-width: 1.2; }
      .main-border { stroke: #000; stroke-width: 2.5; fill: none; }
      /* 고대비 숫자 스타일 */
      .num-big { font-family: 'Pretendard', sans-serif; font-size: 36px; font-weight: 900; fill: #fff; text-shadow: 2px 2px 0px rgba(0,0,0,0.2); }
      .num-small { font-family: 'Pretendard', sans-serif; font-size: 18px; font-weight: 900; fill: #fff; }
      /* 포인트 컬러 */
      .sq1 { fill: #0056b3; } /* Deep Blue */
      .sq2 { fill: #28a745; } /* Emerald Green */
      .sq3 { fill: #ffc107; } /* Amber (번호 가독성을 위해 텍스트 색상 조절 가능) */
      .sq4 { fill: #fd7e14; } /* Orange */
      .sq5 { fill: #dc3545; } /* Crimson Red */
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <g transform="translate(40, 40)">
    <rect width="440" height="270" rx="12" class="card"/>
    <text x="25" y="40" class="step-tag">Step 1. 3 x 7 직사각형</text>
    <g transform="translate(80, 90)">
      <rect width="280" height="120" fill="#fff" class="main-border"/>
      <path d="M40 0v120 M80 0v120 M120 0v120 M160 0v120 M200 0v120 M240 0v120" class="grid-line"/>
      <path d="M0 40h280 M0 80h280" class="grid-line"/>
      <line x1="0" y1="-25" x2="280" y2="-25" class="dim-line"/>
      <text x="140" y="-35" text-anchor="middle" class="label-text">7</text>
      <line x1="-25" y1="0" x2="-25" y2="120" class="dim-line"/>
      <text x="-40" y="65" text-anchor="end" class="label-text">3</text>
    </g>
  </g>

  <g transform="translate(520, 40)">
    <rect width="440" height="270" rx="12" class="card"/>
    <text x="25" y="40" class="step-tag">Step 2. 3x3 절단 (1개)</text>
    <g transform="translate(80, 90)">
      <rect width="120" height="120" class="sq1 main-border" filter="url(#strongShadow)"/>
      <text x="60" y="72" text-anchor="middle" class="num-big">1</text>
      <rect x="120" width="160" height="120" fill="none" class="main-border" stroke-dasharray="6,4" stroke="#888"/>
      <text x="60" y="-15" text-anchor="middle" class="label-text">3</text>
      <text x="200" y="-15" text-anchor="middle" class="label-text" fill="#0056b3">남은 너비: 4</text>
    </g>
  </g>

  <g transform="translate(40, 340)">
    <rect width="440" height="270" rx="12" class="card"/>
    <text x="25" y="40" class="step-tag">Step 3. 추가 3x3 절단 (1개)</text>
    <g transform="translate(80, 90)">
      <rect width="120" height="120" class="sq1" opacity="0.2"/>
      <rect x="120" width="120" height="120" class="sq2 main-border" filter="url(#strongShadow)"/>
      <text x="180" y="72" text-anchor="middle" class="num-big">2</text>
      <rect x="240" width="40" height="120" fill="none" class="main-border" stroke-dasharray="6,4" stroke="#888"/>
      <text x="180" y="-15" text-anchor="middle" class="label-text">3</text>
      <text x="260" y="-15" text-anchor="middle" class="label-text" fill="#28a745">1</text>
    </g>
  </g>

  <g transform="translate(520, 340)">
    <rect width="440" height="270" rx="12" class="card"/>
    <text x="25" y="40" class="step-tag">Step 4. 나머지 3x1 분할 (3개)</text>
    <g transform="translate(80, 90)">
      <rect width="120" height="120" class="sq1" opacity="0.1"/>
      <rect x="120" width="120" height="120" class="sq2" opacity="0.1"/>
      
      <rect x="240" y="0" width="40" height="40" class="sq3 main-border" filter="url(#strongShadow)"/>
      <text x="260" y="27" text-anchor="middle" class="num-small" fill="#000">3</text>
      
      <rect x="240" y="40" width="40" height="40" class="sq4 main-border" filter="url(#strongShadow)"/>
      <text x="260" y="67" text-anchor="middle" class="num-small">4</text>
      
      <rect x="240" y="80" width="40" height="40" class="sq5 main-border" filter="url(#strongShadow)"/>
      <text x="260" y="107" text-anchor="middle" class="num-small">5</text>
      
      <line x1="300" y1="80" x2="300" y2="120" class="dim-line"/>
      <text x="315" y="105" class="label-text">1</text>
    </g>
    <rect x="260" y="220" width="150" height="35" rx="17" fill="#dc3545"/>
    <text x="335" y="245" text-anchor="middle" font-family="Pretendard" font-size="20" font-weight="900" fill="#fff">총 개수: 5개</text>
  </g>

  <g stroke="#bbb" stroke-width="2.5" fill="none">
    <path d="M485 175 h30" marker-end="url(#arrow)"/>
    <path d="M260 315 v20" marker-end="url(#arrow)"/>
    <path d="M485 475 h30" marker-end="url(#arrow)"/>
  </g>
</svg>

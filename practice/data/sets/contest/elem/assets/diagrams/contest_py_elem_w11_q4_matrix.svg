<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="30" font-family="Arial" font-size="20" fill="#111">b11 q4 matrix index map: output uses a[2-j][i]</text>
  <g font-family="Arial" font-size="18" fill="#111" stroke="#333" stroke-width="1">
    <rect x="40" y="70" width="300" height="180" fill="#fafafa"/>
    <line x1="140" y1="70" x2="140" y2="250"/><line x1="240" y1="70" x2="240" y2="250"/>
    <line x1="40" y1="130" x2="340" y2="130"/><line x1="40" y1="190" x2="340" y2="190"/>
    <text x="85" y="108">0</text><text x="185" y="108">1</text><text x="285" y="108">2</text>
    <text x="85" y="168">3</text><text x="185" y="168">4</text><text x="285" y="168">5</text>
    <text x="85" y="228">6</text><text x="185" y="228">7</text><text x="285" y="228">8</text>
  </g>
  <g font-family="Arial" font-size="18" fill="#111" stroke="#333" stroke-width="1">
    <rect x="430" y="70" width="300" height="180" fill="#f6fbff"/>
    <line x1="530" y1="70" x2="530" y2="250"/><line x1="630" y1="70" x2="630" y2="250"/>
    <line x1="430" y1="130" x2="730" y2="130"/><line x1="430" y1="190" x2="730" y2="190"/>
    <text x="475" y="108">6</text><text x="575" y="108">3</text><text x="675" y="108">0</text>
    <text x="475" y="168">7</text><text x="575" y="168">4</text><text x="675" y="168">1</text>
    <text x="475" y="228">8</text><text x="575" y="228">5</text><text x="675" y="228">2</text>
  </g>
  <text x="135" y="275" font-family="Arial" font-size="16" fill="#333">input a[row][col]</text>
  <text x="520" y="275" font-family="Arial" font-size="16" fill="#333">output print(a[2-j][i])</text>
  <g stroke="#0a6" stroke-width="2" marker-end="url(#arrow)">
    <line x1="85" y1="228" x2="475" y2="108"/>
    <line x1="185" y1="228" x2="475" y2="168"/>
    <line x1="285" y1="228" x2="475" y2="228"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0a6"/>
    </marker>
  </defs>
</svg>

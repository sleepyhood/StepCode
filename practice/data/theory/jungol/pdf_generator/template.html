<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>PDF Export</title>
    <!-- 인쇄용 스타일 CSS -->
    <style>
        /* CSS_CONTENT_PLACEHOLDER */
    </style>

    <!-- KaTeX 수식 렌더러 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <!-- PrismJS (코드 블록 하이라이팅: 모던하고 깔끔한 테마) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-twilight.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // 2026년형 모던 트렌드: 요소를 계층화하고 아름다운 컨테이너로 감싸기
            const container = document.querySelector('.page-content');
            const children = Array.from(container.children);

            let cards = [];
            let tempGroup = [];
            let tocData = [];

            children.forEach(el => {
                if (el.tagName === 'H3' && el.textContent.includes('📝')) {
                    if (tempGroup.length > 0) cards.push(tempGroup);
                    tempGroup = [el];
                } else if (el.tagName === 'HR') {
                    if (tempGroup.length > 0) cards.push(tempGroup);
                    tempGroup = [];
                    el.remove(); // 기존 점선 제거
                } else {
                    tempGroup.push(el);
                }
            });
            if (tempGroup.length > 0) cards.push(tempGroup);

            container.innerHTML = '';

            cards.forEach(group => {
                if (group.length === 0) return;

                // ------ TOC 수집 ------
                let sectionTitle = "";
                let itemTitle = "";
                let itemId = "";

                if (group[0].tagName !== 'H3') {
                    // 단원/카테고리 (TOC 그룹화용)
                    group.forEach(el => {
                        if (el.tagName === 'P' && el.children.length === 1 && el.children[0].tagName === 'STRONG') {
                            let text = el.children[0].textContent.trim();
                            if (text.startsWith('&lt;') && text.endsWith('&gt;')) text = text.substring(4, text.length - 4);
                            else if (text.startsWith('<') && text.endsWith('>')) text = text.substring(1, text.length - 1);

                            el.className = 'category-title';
                            el.innerHTML = `<span class="cat-icon">✦</span> ${text} <span class="cat-line"></span>`;
                            sectionTitle = text;
                        }
                    });

                    let catWrapper = document.createElement('div');
                    catWrapper.className = 'category-wrapper';
                    group.forEach(el => catWrapper.appendChild(el));
                    container.appendChild(catWrapper);

                    // TOC에 새 섹션 추가
                    if (sectionTitle) {
                        tocData.push({ type: 'section', title: sectionTitle });
                    }
                    return;
                }

                // ------------------
                // 문항(Problem) 모던 카드 레이아웃 생성 
                // ------------------
                const cardOuter = document.createElement('div');
                cardOuter.className = 'card-outer';

                const cardInner = document.createElement('div');
                cardInner.className = 'p-card';

                const problemSection = document.createElement('div');
                problemSection.className = 'p-problem';

                let solutionSection = null;

                group.forEach((el, index) => {
                    // 해설 영역의 시작점
                    if (el.tagName === 'P' && el.innerHTML.includes('💡 선생님')) {
                        solutionSection = document.createElement('div');
                        solutionSection.className = 'p-solution';

                        let htmlStr = el.innerHTML;
                        htmlStr = htmlStr.replace('<strong>💡 선생님을 위한 풀이 가이드:</strong>',
                            '<div class="solution-header"><span class="sol-icon">💡</span> 선생님을 위한 풀이 가이드</div>');
                        htmlStr = htmlStr.replace('<strong>💡 선생님을 위한 풀이 가이드 :</strong>',
                            '<div class="solution-header"><span class="sol-icon">💡</span> 선생님을 위한 풀이 가이드</div>');
                        el.innerHTML = htmlStr;
                        el.className = 'sol-first-p';
                        solutionSection.appendChild(el);
                    }
                    else if (solutionSection) {
                        solutionSection.appendChild(el);
                    }
                    else {
                        if (el.tagName === 'H3') {
                            let raw = el.textContent.trim();
                            let match = raw.match(/📝\s*([\w\d]+)\.\s*(.*)/);
                            if (match) {
                                itemId = `question-${match[1]}`;
                                itemTitle = match[2];

                                // ID 부여 (앵커용)
                                cardOuter.id = itemId;

                                el.innerHTML = `
                                    <div class="h3-badge-wrap">
                                        <div class="h3-num">Question ${match[1]}</div>
                                    </div>
                                    <div class="h3-text">${match[2]}</div>
                                `;
                                el.className = 'modern-h3';
                            }
                        }
                        else if (el.tagName === 'P') {
                            if (el.innerHTML.startsWith('<strong>문제:</strong>')) {
                                el.innerHTML = el.innerHTML.replace('<strong>문제:</strong>', '<span class="badge badge-prob">Q.</span>');
                                el.classList.add('prob-text');
                            }
                            else if (el.innerHTML.startsWith('<strong>선택지:</strong>')) {
                                el.innerHTML = el.innerHTML.replace('<strong>선택지:</strong>', '<div class="opt-label">OPTIONS</div>');
                                el.classList.add('opt-text');
                            }
                            else if (el.innerHTML.includes('✅ 정답:')) {
                                el.innerHTML = el.innerHTML.replace('✅ 정답:', '<span>ANSWER</span>');
                                el.classList.add('p-answer');
                            }
                        }
                        problemSection.appendChild(el);
                    }
                });

                // TOC에 문항 추가
                if (itemId && itemTitle) {
                    tocData.push({ type: 'item', id: itemId, title: itemTitle });
                }

                cardInner.appendChild(problemSection);
                if (solutionSection) cardInner.appendChild(solutionSection);
                cardOuter.appendChild(cardInner);
                container.appendChild(cardOuter);
            });

            // ------ 목차(TOC) UI 생성하여 앞쪽에 삽입 ------
            if (tocData.length > 0) {
                const tocWrapper = document.createElement('div');
                tocWrapper.className = 'toc-wrapper';

                const tocHeader = document.createElement('div');
                tocHeader.className = 'toc-header';
                tocHeader.innerHTML = '<h2>Table of Contents</h2><p>해설지 문항 한눈에 보기</p>';
                tocWrapper.appendChild(tocHeader);

                const tocList = document.createElement('div');
                tocList.className = 'toc-list';

                tocData.forEach(item => {
                    if (item.type === 'section') {
                        const sec = document.createElement('div');
                        sec.className = 'toc-section-title';
                        sec.innerText = item.title;
                        tocList.appendChild(sec);
                    } else if (item.type === 'item') {
                        const link = document.createElement('a');
                        link.className = 'toc-item-link';
                        link.href = `#${item.id}`;

                        const numBadge = document.createElement('span');
                        numBadge.className = 'toc-item-badge';
                        numBadge.innerText = item.id.replace('question-', 'Q');

                        const titleText = document.createElement('span');
                        titleText.className = 'toc-item-text';
                        titleText.innerText = item.title;

                        link.appendChild(numBadge);
                        link.appendChild(titleText);
                        tocList.appendChild(link);
                    }
                });

                tocWrapper.appendChild(tocList);
                container.insertBefore(tocWrapper, container.firstChild);
            }

            // 2. KaTeX 수학 수식 렌더링
            renderMathInElement(document.body, {
                delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '$', right: '$', display: false },
                    { left: '\\(', right: '\\)', display: false },
                    { left: '\\[', right: '\\]', display: true }
                ],
                throwOnError: false
            });

            // 3. Prism JS 렌더링
            if (window.Prism) Prism.highlightAll();
        });
    </script>
</head>

<body>
    <!-- 최상위 랩퍼 (2026 웹 앱 패딩 스타일) -->
    <div class="app-wrapper">
        <!-- 배경 데코레이션 로고/형태 -->
        <div class="bg-deco bg-deco-1"></div>
        <div class="bg-deco bg-deco-2"></div>

        <table class="layout-table">
            <thead>
                <tr>
                    <th class="layout-header"></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="layout-body">
                        <div class="app-content-box">
                            <div class="page-content">
                                <!-- CONTENT_PLACEHOLDER -->
                            </div>
                        </div>
                    </td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td class="layout-footer"></td>
                </tr>
            </tfoot>
        </table>
    </div>
</body>

</html>

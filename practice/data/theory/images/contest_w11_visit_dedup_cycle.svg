<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <defs><style>
  .t{font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;fill:#1f2937}
  .b{font-size:16px;font-weight:600}.s{font-size:14px}
  .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.accent{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.warn{fill:#fef2f2;stroke:#dc2626;stroke-width:2}
  .line{stroke:#475569;stroke-width:2;marker-end:url(#m)}
  </style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect x="20" y="24" width="220" height="90" rx="12" class="box"/>
  <text x="38" y="56" class="t b">새 시작점 발견</text><text x="38" y="82" class="t s">if(grid[x][y])면 카운트+1</text>
  <rect x="280" y="24" width="220" height="90" rx="12" class="accent"/>
  <text x="298" y="56" class="t b">즉시 방문 마킹</text><text x="298" y="82" class="t s">grid[x][y]=0 또는 visited=1</text>
  <rect x="540" y="24" width="220" height="90" rx="12" class="box"/>
  <text x="558" y="56" class="t b">인접 칸 확장</text><text x="558" y="82" class="t s">유효 좌표만 재귀 호출</text>
  <rect x="800" y="24" width="160" height="90" rx="12" class="box"/>
  <text x="818" y="56" class="t b">요소 소거 완료</text><text x="818" y="82" class="t s">중복 카운트 방지</text>
  <line x1="242" y1="69" x2="278" y2="69" class="line"/><line x1="502" y1="69" x2="538" y2="69" class="line"/><line x1="762" y1="69" x2="798" y2="69" class="line"/>
  <rect x="20" y="150" width="940" height="180" rx="12" class="warn"/>
  <text x="38" y="182" class="t b">주의점</text>
  <text x="38" y="208" class="t s">- 방문 마킹이 늦으면 같은 요소를 여러 번 세게 된다.</text>
  <text x="38" y="234" class="t s">- 시작점마다 카운트하고, 요소 내부 칸에서는 카운트하지 않는다.</text>
  <text x="38" y="260" class="t s">- (0,0) 방향 포함 루프에서는 자기 자신 재호출 방지 조건이 필요하다.</text>
  <text x="38" y="296" class="t s">루틴: 시작점 카운트 -> 즉시 마킹 -> 전체 소거를 반복한다.</text>
</svg>

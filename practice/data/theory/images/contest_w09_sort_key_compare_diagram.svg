<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <defs>
    <style>
      .t { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 16px; fill: #1f2937; }
      .th { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.4; }
      .td { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.1; }
      .ok { fill: #ecfeff; stroke: #06b6d4; stroke-width: 1.5; rx: 8; }
      .arr { stroke: #374151; stroke-width: 2; marker-end: url(#arrow); fill: none; }
      .mono { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 15px; fill: #111827; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="34" y="36" class="t">정렬 키 비교 과정: key=(x, y)는 x를 먼저 비교하고, 같으면 y를 비교합니다.</text>

  <!-- left: raw data -->
  <rect x="50" y="74" width="240" height="46" class="ok"/>
  <text x="68" y="104" class="t">원본: (3,10), (2,6), (3,2), (1,9)</text>

  <!-- table -->
  <rect x="330" y="74" width="130" height="40" class="th"/><text x="373" y="100" class="mono">원소</text>
  <rect x="460" y="74" width="140" height="40" class="th"/><text x="502" y="100" class="mono">key1=x</text>
  <rect x="600" y="74" width="140" height="40" class="th"/><text x="642" y="100" class="mono">key2=y</text>
  <rect x="740" y="74" width="190" height="40" class="th"/><text x="775" y="100" class="mono">비교 우선순위</text>

  <rect x="330" y="114" width="130" height="36" class="td"/><text x="360" y="138" class="mono">(3,10)</text>
  <rect x="460" y="114" width="140" height="36" class="td"/><text x="522" y="138" class="mono">3</text>
  <rect x="600" y="114" width="140" height="36" class="td"/><text x="662" y="138" class="mono">10</text>
  <rect x="740" y="114" width="190" height="36" class="td"/><text x="762" y="138" class="mono">x 우선, 같으면 y</text>

  <rect x="330" y="150" width="130" height="36" class="td"/><text x="366" y="174" class="mono">(2,6)</text>
  <rect x="460" y="150" width="140" height="36" class="td"/><text x="522" y="174" class="mono">2</text>
  <rect x="600" y="150" width="140" height="36" class="td"/><text x="662" y="174" class="mono">6</text>
  <rect x="740" y="150" width="190" height="36" class="td"/>

  <rect x="330" y="186" width="130" height="36" class="td"/><text x="366" y="210" class="mono">(3,2)</text>
  <rect x="460" y="186" width="140" height="36" class="td"/><text x="522" y="210" class="mono">3</text>
  <rect x="600" y="186" width="140" height="36" class="td"/><text x="662" y="210" class="mono">2</text>
  <rect x="740" y="186" width="190" height="36" class="td"/>

  <rect x="330" y="222" width="130" height="36" class="td"/><text x="366" y="246" class="mono">(1,9)</text>
  <rect x="460" y="222" width="140" height="36" class="td"/><text x="522" y="246" class="mono">1</text>
  <rect x="600" y="222" width="140" height="36" class="td"/><text x="662" y="246" class="mono">9</text>
  <rect x="740" y="222" width="190" height="36" class="td"/>

  <path d="M170,120 L330,120" class="arr"/>

  <rect x="50" y="292" width="880" height="42" class="ok"/>
  <text x="72" y="319" class="t">정렬 결과: (1,9), (2,6), (3,2), (3,10)  → x 오름차순, x 동률에서는 y 오름차순</text>
</svg>

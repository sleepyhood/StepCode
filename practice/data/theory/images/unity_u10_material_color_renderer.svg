<svg width="650" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="650" height="200" fill="#2D2D30" rx="8" />
  
  <text x="325" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Material 색상 변경 원리 체인</text>
  
  <!-- GameObject -->
  <rect x="20" y="50" width="160" height="110" fill="#1E1E1E" rx="8" stroke="#4CAF50" stroke-width="2"/>
  <text x="100" y="80" fill="#4CAF50" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GameObject</text>
  <text x="100" y="105" fill="#CCCCCC" font-family="sans-serif" font-size="12" text-anchor="middle">(게임 세상의 실체)</text>
  
  <!-- Renderer -->
  <rect x="240" y="50" width="170" height="110" fill="#1E1E1E" rx="8" stroke="#03A9F4" stroke-width="2"/>
  <text x="325" y="80" fill="#03A9F4" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">MeshRenderer</text>
  <text x="325" y="100" fill="#CCCCCC" font-family="monospace" font-size="10" text-anchor="middle">GetComponent</text>
  <text x="325" y="115" fill="#888888" font-family="monospace" font-size="10" text-anchor="middle">&lt;Renderer&gt;()</text>

  <!-- Material -->
  <rect x="470" y="50" width="160" height="110" fill="#1E1E1E" rx="8" stroke="#FFC107" stroke-width="2"/>
  <text x="550" y="80" fill="#FFC107" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Material</text>
  <text x="550" y="100" fill="#CCCCCC" font-family="monospace" font-size="10" text-anchor="middle">.color = </text>
  <text x="550" y="115" fill="#FF5252" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Color.red</text>
  <text x="550" y="135" fill="#888888" font-family="sans-serif" font-size="10" text-anchor="middle">(코팅지 속성)</text>

  <!-- Arrows -->
  <path d="M 180 105 L 230 105" stroke="#FFFFFF" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 410 105 L 460 105" stroke="#FFFFFF" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" />
    </marker>
  </defs>
</svg>

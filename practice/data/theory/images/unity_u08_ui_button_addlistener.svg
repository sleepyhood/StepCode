<svg width="650" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="650" height="200" fill="#2D2D30" rx="8" />
  
  <text x="325" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">AddListener 콜백 (Callback) 구조</text>
  
  <!-- Editor logic side -->
  <rect x="20" y="50" width="220" height="130" fill="#1E1E1E" rx="8" stroke="#4CAF50" stroke-width="2"/>
  <text x="130" y="80" fill="#4CAF50" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">스크립트 (로직 코드)</text>
  
  <rect x="30" y="100" width="200" height="60" fill="#252526" rx="4" />
  <text x="40" y="125" fill="#C586C0" font-family="monospace" font-size="12">void</text>
  <text x="80" y="125" fill="#DCDCAA" font-family="monospace" font-size="12">Attack()</text>
  <text x="140" y="125" fill="#D4D4D4" font-family="monospace" font-size="12">{ ... }</text>
  <text x="40" y="145" fill="#4CAF50" font-family="monospace" font-size="12">▶ 실행되어야 할 나의 함수</text>

  <!-- Registration arrow -->
  <path d="M 250 85 C 310 80, 360 85, 400 95" stroke="#F44336" stroke-width="2" fill="none" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>
  <text x="325" y="75" fill="#F44336" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">AddListener(Attack)</text>
  <text x="325" y="90" fill="#888888" font-family="sans-serif" font-size="10" text-anchor="middle">함수명 통째로 넘김 (구독 등록)</text>

  <!-- Button UI side -->
  <rect x="410" y="50" width="220" height="130" fill="#1E1E1E" rx="8" stroke="#03A9F4" stroke-width="2"/>
  <text x="520" y="80" fill="#03A9F4" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Button UI 컴포넌트</text>
  
  <circle cx="460" cy="140" r="15" fill="#FFC107" />
  <text x="540" y="145" fill="#CCCCCC" font-family="sans-serif" font-size="12" text-anchor="middle">onClick 이벤트 감지기</text>

  <!-- Execution arrow -->
  <path d="M 460 120 C 440 100, 380 140, 240 130" stroke="#03A9F4" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="325" y="160" fill="#03A9F4" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">유저가 클릭 시 자동 실행 지시!</text>

  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F44336" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#03A9F4" />
    </marker>
  </defs>
</svg>

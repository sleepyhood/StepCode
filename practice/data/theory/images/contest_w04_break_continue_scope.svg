<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-labelledby="title desc">
  <title id="title">break continue 적용 범위</title>
  <desc id="desc">continue는 현재 회차 건너뛰기, break는 가장 가까운 루프 1개 종료라는 범위를 비교한다.</desc>
  <style>
    text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #1f2937; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
    .accent { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 12; }
    .warn { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 12; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 12; }
    .t2 { font-size: 16px; font-weight: 700; }
    .t3 { font-size: 14px; }
  </style>

  <rect x="24" y="24" width="452" height="270" class="accent"/>
  <text x="44" y="52" class="t2">continue 동작</text>
  <text x="44" y="78" class="t3">- 현재 루프 회차의 남은 본문을 건너뛴다.</text>
  <text x="44" y="100" class="t3">- 같은 루프의 다음 회차 조건 검사로 이동한다.</text>
  <rect x="56" y="126" width="388" height="142" class="box"/>
  <text x="76" y="154" class="t3">for (...) {</text>
  <text x="76" y="176" class="t3">  if (조건) continue;   // 아래 문장만 생략</text>
  <text x="76" y="198" class="t3">  누적/출력;</text>
  <text x="76" y="220" class="t3">}</text>
  <text x="76" y="246" class="t3">핵심: 루프 전체 종료가 아니다.</text>

  <rect x="504" y="24" width="452" height="270" class="warn"/>
  <text x="524" y="52" class="t2">break 동작</text>
  <text x="524" y="78" class="t3">- 가장 가까운 반복문 1개를 즉시 종료한다.</text>
  <text x="524" y="100" class="t3">- 외부 루프는 별도 제어가 없으면 계속 실행된다.</text>
  <rect x="536" y="126" width="388" height="142" class="box"/>
  <text x="556" y="154" class="t3">for (outer) {</text>
  <text x="556" y="176" class="t3">  for (inner) {</text>
  <text x="556" y="198" class="t3">    if (조건) break;   // inner만 종료</text>
  <text x="556" y="220" class="t3">  }</text>
  <text x="556" y="242" class="t3">}</text>

</svg>

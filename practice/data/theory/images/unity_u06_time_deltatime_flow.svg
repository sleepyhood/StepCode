<svg width="650" height="220" xmlns="http://www.w3.org/2000/svg">
  <rect width="650" height="220" fill="#2D2D30" rx="8" />
  
  <text x="325" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Time.deltaTime 프레임 보정</text>
  
  <rect x="20" y="50" width="610" height="150" fill="#1E1E1E" rx="4" />
  
  <!-- Without deltaTime -->
  <text x="30" y="75" fill="#F44336" font-family="sans-serif" font-size="14" font-weight="bold">❌ Time.deltaTime을 곱하지 않았을 때 (프레임 단위 이동)</text>
  <text x="30" y="100" fill="#CCCCCC" font-family="sans-serif" font-size="12">초당 10프레임 기기 → 1초 후 이동거리: 10</text>
  <rect x="250" y="90" width="100" height="10" fill="#F44336" />
  
  <text x="30" y="120" fill="#CCCCCC" font-family="sans-serif" font-size="12">초당 60프레임 기기 → 1초 후 이동거리: 60</text>
  <rect x="250" y="110" width="350" height="10" fill="#F44336" />

  <!-- With deltaTime -->
  <line x1="20" y1="135" x2="630" y2="135" stroke="#333333" stroke-width="2" stroke-dasharray="4,4" />
  
  <text x="30" y="155" fill="#4CAF50" font-family="sans-serif" font-size="14" font-weight="bold">✅ Time.deltaTime을 곱했을 때 (시간 단위 이동)</text>
  <text x="30" y="180" fill="#CCCCCC" font-family="sans-serif" font-size="12">초당 10프레임 기기 → 1초 후 이동거리: 1</text>
  <rect x="250" y="170" width="200" height="10" fill="#4CAF50" />
  
  <text x="30" y="200" fill="#CCCCCC" font-family="sans-serif" font-size="12">초당 60프레임 기기 → 1초 후 이동거리: 1</text>
  <rect x="250" y="190" width="200" height="10" fill="#4CAF50" />
</svg>

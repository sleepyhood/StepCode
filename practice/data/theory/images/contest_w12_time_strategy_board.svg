<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320">
  <defs><style>
  .t{font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;fill:#1f2937}
  .b{font-size:16px;font-weight:600}.s{font-size:14px}
  .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.accent{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.warn{fill:#fef2f2;stroke:#dc2626;stroke-width:2}
  .line{stroke:#475569;stroke-width:2;marker-end:url(#m)}
  </style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect x="20" y="24" width="280" height="88" rx="12" class="accent"/>
  <text x="38" y="56" class="t b">즉시 풀이</text><text x="38" y="82" class="t s">추적표 6행 이내 문항 우선</text>
  <rect x="350" y="24" width="280" height="88" rx="12" class="box"/>
  <text x="368" y="56" class="t b">검산 후 제출</text><text x="368" y="82" class="t s">경계/판정식 확인 후 제출</text>
  <rect x="680" y="24" width="280" height="88" rx="12" class="box"/>
  <text x="698" y="56" class="t b">보류</text><text x="698" y="82" class="t s">시간 남을 때 핵심 분기 재시도</text>
  <line x1="302" y1="68" x2="348" y2="68" class="line"/><line x1="632" y1="68" x2="678" y2="68" class="line"/>
  <rect x="20" y="132" width="940" height="168" rx="12" class="warn"/>
  <text x="38" y="164" class="t b">운영 규칙</text>
  <text x="38" y="190" class="t s">- 시작 30초: 입력 구조/핵심 변수 확인</text>
  <text x="38" y="216" class="t s">- 중반: 확정 가능한 문항 먼저 제출</text>
  <text x="38" y="242" class="t s">- 후반: 보류 문항은 경계값 위주로 재검토</text>
  <text x="38" y="268" class="t s">어려운 1문항에 시간 고정하면 전체 점수 기대값이 하락한다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <defs>
    <style>
      .t { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 16px; fill: #1f2937; }
      .k { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .box { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.4; rx: 10; }
      .hi { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1.8; rx: 10; }
      .ok { fill: #ecfeff; stroke: #06b6d4; stroke-width: 1.6; rx: 10; }
      .arr { stroke: #374151; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="34" y="42" class="k">Σi Σj (Ai * Bj)  =  (ΣAi) * (ΣBj)</text>
  <text x="34" y="70" class="t">이중합에서 i, j가 독립이면 내부 전개 대신 합의 곱으로 축약할 수 있습니다.</text>

  <rect x="40" y="100" width="280" height="120" class="box"/>
  <text x="62" y="136" class="t">원래 계산</text>
  <text x="62" y="170" class="t">Σi Σj (Ai * Bj)</text>
  <text x="62" y="202" class="t">반복문 2중 전개</text>

  <rect x="360" y="100" width="260" height="120" class="hi"/>
  <text x="382" y="136" class="t">분해</text>
  <text x="382" y="170" class="t">(ΣAi) 와 (ΣBj)</text>
  <text x="382" y="202" class="t">각각 따로 계산</text>

  <rect x="660" y="100" width="280" height="120" class="ok"/>
  <text x="682" y="136" class="t">결합</text>
  <text x="682" y="170" class="t">(ΣAi) * (ΣBj)</text>
  <text x="682" y="202" class="t">곱셈 1회로 완료</text>

  <path d="M320,160 L360,160" class="arr"/>
  <path d="M620,160 L660,160" class="arr"/>

  <rect x="40" y="252" width="900" height="72" class="box"/>
  <text x="62" y="284" class="t">예시: A=[1,2,3], B=[4,5] 이면 (ΣA)=6, (ΣB)=9, 따라서 ΣiΣj(Ai*Bj)=54</text>
  <text x="62" y="312" class="t">핵심: Ai와 Bj가 서로 섞이지 않는 곱 구조일 때만 이 축약이 성립합니다.</text>
</svg>

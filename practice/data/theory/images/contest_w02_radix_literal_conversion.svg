<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-labelledby="title desc">
  <title id="title">진법 리터럴 변환 흐름</title>
  <desc id="desc">0x 접두사와 0 접두사를 기준으로 16진수와 8진수를 판별해 10진수로 변환한 뒤 계산하는 과정을 보여준다.</desc>
  <style>
    text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #1f2937; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
    .accent { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 12; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 12; }
    .warn { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 12; }
    .t2 { font-size: 16px; font-weight: 700; }
    .t3 { font-size: 14px; }
    .line { stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155" />
    </marker>
  </defs>

  <rect x="24" y="28" width="220" height="78" class="accent" />
  <text x="134" y="58" text-anchor="middle" class="t2">리터럴 확인</text>
  <text x="134" y="82" text-anchor="middle" class="t3">예: 0x32, 030</text>

  <rect x="286" y="28" width="220" height="78" class="box" />
  <text x="396" y="58" text-anchor="middle" class="t2">접두사 판별</text>
  <text x="396" y="82" text-anchor="middle" class="t3">0x -> 16진, 0 -> 8진</text>

  <rect x="548" y="28" width="220" height="78" class="ok" />
  <text x="658" y="58" text-anchor="middle" class="t2">10진 변환</text>
  <text x="658" y="82" text-anchor="middle" class="t3">0x32=50, 030=24</text>

  <rect x="810" y="28" width="146" height="78" class="accent" />
  <text x="883" y="58" text-anchor="middle" class="t2">연산/출력</text>
  <text x="883" y="82" text-anchor="middle" class="t3">변환 후 계산</text>

  <line x1="244" y1="67" x2="286" y2="67" class="line" />
  <line x1="506" y1="67" x2="548" y2="67" class="line" />
  <line x1="768" y1="67" x2="810" y2="67" class="line" />

  <rect x="24" y="142" width="454" height="146" class="box" />
  <text x="44" y="170" class="t2">변환 예시</text>
  <text x="44" y="196" class="t3">- 0x12 = 1*16 + 2 = 18</text>
  <text x="44" y="218" class="t3">- 012 = 1*8 + 2 = 10</text>
  <text x="44" y="240" class="t3">- 0x20 = 32, 010 = 8</text>
  <text x="44" y="262" class="t3">접두사부터 판단하면 계산 실수를 크게 줄일 수 있다.</text>

  <rect x="502" y="142" width="454" height="146" class="warn" />
  <text x="522" y="170" class="t2">오답 패턴</text>
  <text x="522" y="196" class="t3">- 030을 30으로 해석</text>
  <text x="522" y="218" class="t3">- 0x32를 문자 32로 오독</text>
  <text x="522" y="240" class="t3">- 변환 전 바로 사칙연산 수행</text>
  <text x="522" y="262" class="t3">해결: 접두사 -> 10진 변환 -> 연산 순서 고정</text>
</svg>

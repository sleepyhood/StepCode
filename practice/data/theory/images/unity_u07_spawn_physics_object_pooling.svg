<svg width="650" height="250" xmlns="http://www.w3.org/2000/svg">
  <rect width="650" height="250" fill="#2D2D30" rx="8" />
  
  <text x="325" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">오브젝트 풀링 (Object Pooling) 구조</text>
  
  <rect x="40" y="60" width="220" height="160" fill="#1E1E1E" rx="8" stroke="#4CAF50" stroke-width="2"/>
  <text x="150" y="85" fill="#4CAF50" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Object Pool (여유 객체 창고)</text>
  <text x="150" y="105" fill="#888888" font-family="sans-serif" font-size="12" text-anchor="middle">비활성화(SetActive(false)) 대기</text>
  
  <!-- Pool items -->
  <circle cx="90" cy="150" r="15" fill="#555555" />
  <circle cx="150" cy="150" r="15" fill="#555555" />
  <circle cx="210" cy="150" r="15" fill="#555555" />
  
  <rect x="390" y="60" width="220" height="160" fill="#1E1E1E" rx="8" stroke="#03A9F4" stroke-width="2"/>
  <text x="500" y="85" fill="#03A9F4" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Scene (실제 필드)</text>
  <text x="500" y="105" fill="#888888" font-family="sans-serif" font-size="12" text-anchor="middle">활성화(SetActive(true)) 상태</text>
  
  <!-- Active items -->
  <circle cx="470" cy="170" r="15" fill="#F44336" />
  <circle cx="530" cy="140" r="15" fill="#F44336" />
  
  <!-- Arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" />
    </marker>
  </defs>

  <path d="M 280 120 C 310 100, 350 100, 370 120" stroke="#FFFFFF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="325" y="105" fill="#4CAF50" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">필요할 때 Spawn()</text>
  
  <path d="M 370 170 C 350 190, 310 190, 280 170" stroke="#FFFFFF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="325" y="200" fill="#F44336" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">다 쓰면 Despawn() 반납</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">분할 재귀 호출 트리와 리프 출력 순서</title>
  <desc id="desc">f(0,3) 호출이 좌우로 분할되고 리프에서 출력될 때 0,1,2,3 순서로 출력되는 구조를 보여준다.</desc>
  <style>
    text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #1f2937; }
    .title { font-size: 16px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 12px; fill: #334155; }
    .node { fill: #f1f5f9; stroke: #475569; stroke-width: 2; }
    .leaf { fill: #dff6ff; stroke: #06b6d4; stroke-width: 2; }
    .ntext { font-size: 21px; font-weight: 700; text-anchor: middle; }
    .ltxt { font-size: 22px; font-weight: 700; text-anchor: middle; }
    .out { font-size: 15px; font-weight: 700; fill: #0f766e; text-anchor: middle; }
    .line { stroke: #64748b; stroke-width: 3; }
    .note { fill: #fff7db; stroke: #eab308; stroke-width: 2; }
    .noteText { font-size: 18px; font-weight: 700; fill: #334155; }
  </style>

  <text x="22" y="34" class="title">분할 재귀 호출 트리 (예: f(0,3), 리프에서 print): 출력 순서 번호를 리프에 표시</text>

  <rect x="430" y="52" width="120" height="52" rx="12" class="node"/>
  <text x="490" y="86" class="ntext">f(0,3)</text>

  <rect x="250" y="132" width="120" height="52" rx="12" class="node"/>
  <text x="310" y="166" class="ntext">f(0,1)</text>

  <rect x="610" y="132" width="120" height="52" rx="12" class="node"/>
  <text x="670" y="166" class="ntext">f(2,3)</text>

  <line x1="490" y1="104" x2="310" y2="132" class="line"/>
  <line x1="490" y1="104" x2="670" y2="132" class="line"/>

  <rect x="160" y="224" width="120" height="52" rx="12" class="leaf"/>
  <text x="220" y="258" class="ltxt">0</text>
  <text x="220" y="292" class="out">출력 #1</text>

  <rect x="340" y="224" width="120" height="52" rx="12" class="leaf"/>
  <text x="400" y="258" class="ltxt">1</text>
  <text x="400" y="292" class="out">출력 #2</text>

  <rect x="520" y="224" width="120" height="52" rx="12" class="leaf"/>
  <text x="580" y="258" class="ltxt">2</text>
  <text x="580" y="292" class="out">출력 #3</text>

  <rect x="700" y="224" width="120" height="52" rx="12" class="leaf"/>
  <text x="760" y="258" class="ltxt">3</text>
  <text x="760" y="292" class="out">출력 #4</text>

  <line x1="310" y1="184" x2="220" y2="224" class="line"/>
  <line x1="310" y1="184" x2="400" y2="224" class="line"/>
  <line x1="670" y1="184" x2="580" y2="224" class="line"/>
  <line x1="670" y1="184" x2="760" y2="224" class="line"/>

  <rect x="130" y="304" width="720" height="44" rx="10" class="note"/>
  <text x="160" y="333" class="noteText">핵심: 왼쪽 재귀를 먼저 호출하면 리프 출력 순서는 왼쪽에서 오른쪽으로 진행된다.</text>
</svg>

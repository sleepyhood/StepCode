<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-labelledby="title desc">
  <title id="title">printf 폭 정렬 정밀도 조립 흐름</title>
  <desc id="desc">서식 문자열을 폭, 정렬, 정밀도, 리터럴 문자로 분해해 최종 출력 문자열을 구성하는 과정을 보여준다.</desc>
  <style>
    text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #1f2937; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
    .accent { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 12; }
    .warn { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 12; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 12; }
    .t1 { font-size: 18px; font-weight: 700; }
    .t2 { font-size: 15px; font-weight: 700; }
    .t3 { font-size: 13px; }
    .line { stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155" />
    </marker>
  </defs>

  <rect x="24" y="20" width="220" height="78" class="accent" />
  <text x="134" y="48" text-anchor="middle" class="t2">서식 분해</text>
  <text x="134" y="70" text-anchor="middle" class="t3">%6.4lf00 -> w=6, p=4, 리터럴=00</text>

  <rect x="284" y="20" width="210" height="78" class="box" />
  <text x="389" y="48" text-anchor="middle" class="t2">값 반올림</text>
  <text x="389" y="70" text-anchor="middle" class="t3">3.14 -> 3.1400</text>

  <rect x="534" y="20" width="210" height="78" class="ok" />
  <text x="639" y="48" text-anchor="middle" class="t2">폭/정렬 적용</text>
  <text x="639" y="70" text-anchor="middle" class="t3">우측 정렬이면 왼쪽 공백 채움</text>

  <rect x="784" y="20" width="172" height="78" class="accent" />
  <text x="870" y="48" text-anchor="middle" class="t2">리터럴 결합</text>
  <text x="870" y="70" text-anchor="middle" class="t3">뒤의 00 그대로 출력</text>

  <line x1="244" y1="59" x2="284" y2="59" class="line" />
  <line x1="494" y1="59" x2="534" y2="59" class="line" />
  <line x1="744" y1="59" x2="784" y2="59" class="line" />

  <rect x="24" y="132" width="452" height="150" class="box" />
  <text x="42" y="160" class="t2">핵심 체크 순서</text>
  <text x="42" y="186" class="t3">1) 정밀도 반영값 계산</text>
  <text x="42" y="208" class="t3">2) 폭(width)과 정렬(좌/우)로 공백 위치 결정</text>
  <text x="42" y="230" class="t3">3) 서식 밖 리터럴 문자 결합</text>
  <text x="42" y="252" class="t3">4) 최종 문자열 길이/공백을 눈으로 재검산</text>

  <rect x="504" y="132" width="452" height="150" class="warn" />
  <text x="522" y="160" class="t2">오답 패턴</text>
  <text x="522" y="186" class="t3">- 폭을 "최대 자릿수 제한"으로 오해</text>
  <text x="522" y="208" class="t3">- 리터럴(예: 00)을 포맷 일부로 착각</text>
  <text x="522" y="230" class="t3">- 좌측 정렬(-) 유무를 놓치고 공백 위치 반대로 계산</text>
  <text x="522" y="252" class="t3">- 숫자만 보고 문자열 비교를 생략</text>
</svg>

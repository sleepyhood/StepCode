<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <defs>
    <style>
      .t { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 16px; fill: #1f2937; }
      .n { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .s { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .arr { stroke: #374151; stroke-width: 2; marker-end: url(#arrow); fill: none; }
      .dash { stroke-dasharray: 5 4; }
      .box { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.2; rx: 8; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="40" y="36" class="t">전이 그래프 예시: a = [2, 0, 3, 1], 전이식 f(i)=a[i], 시작 b=0</text>

  <!-- nodes -->
  <circle cx="160" cy="170" r="34" class="s"/><text x="152" y="176" class="t">0</text>
  <circle cx="360" cy="90" r="34" class="n"/><text x="352" y="96" class="t">1</text>
  <circle cx="560" cy="170" r="34" class="n"/><text x="552" y="176" class="t">2</text>
  <circle cx="360" cy="250" r="34" class="n"/><text x="352" y="256" class="t">3</text>

  <!-- edges -->
  <path d="M190,155 C245,125 285,106 330,96" class="arr"/>
  <text x="245" y="110" class="t">0→2</text>

  <path d="M390,98 C455,120 490,145 530,164" class="arr"/>
  <text x="455" y="114" class="t">1→0</text>

  <path d="M530,178 C470,207 430,226 390,244" class="arr"/>
  <text x="462" y="236" class="t">2→3</text>

  <path d="M330,244 C268,220 226,197 190,178" class="arr"/>
  <text x="238" y="230" class="t">3→1</text>

  <rect x="40" y="292" width="900" height="46" class="box"/>
  <text x="58" y="321" class="t">추적: b0=0 → b1=a[0]=2 → b2=a[2]=3 → b3=a[3]=1 → b4=a[1]=0 (순환)</text>
</svg>

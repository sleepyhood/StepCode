<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">호출-복귀 계산 순서</title>
  <desc id="desc">재귀 호출이 하강한 뒤 복귀하면서 연산이 적용되는 순서를 단계별로 보여준다.</desc>
  <style>
    text{font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;fill:#1f2937}
    .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:10}
    .accent{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:10}
    .ok{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:10}
    .warn{fill:#fee2e2;stroke:#dc2626;stroke-width:2;rx:10}
    .t2{font-size:16px;font-weight:700}.t3{font-size:14px}
  </style>

  <rect x="24" y="24" width="932" height="72" class="accent"/>
  <text x="44" y="52" class="t2">return f(a-2,b*2) + b</text>
  <text x="44" y="76" class="t3">+b는 하강 단계가 아니라 복귀 단계마다 적용된다.</text>

  <rect x="24" y="112" width="300" height="214" class="box"/>
  <text x="44" y="140" class="t2">하강 단계</text>
  <text x="44" y="166" class="t3">입력 인자만 변화</text>
  <text x="44" y="188" class="t3">a: 감소, b: 갱신</text>
  <text x="44" y="210" class="t3">아직 +b 적용 안 됨</text>

  <rect x="352" y="112" width="300" height="214" class="ok"/>
  <text x="372" y="140" class="t2">복귀 단계</text>
  <text x="372" y="166" class="t3">기저 반환값을 시작점으로</text>
  <text x="372" y="188" class="t3">각 프레임에서 연산 누적</text>
  <text x="372" y="210" class="t3">예: +b, *2, +a 등 적용</text>

  <rect x="680" y="112" width="276" height="214" class="warn"/>
  <text x="700" y="140" class="t2">오답 패턴</text>
  <text x="700" y="166" class="t3">- 하강 단계에서 연산을 미리 적용</text>
  <text x="700" y="188" class="t3">- 복귀 누적 순서를 뒤집음</text>
  <text x="700" y="210" class="t3">- 중간 반환값 기록 누락</text>
</svg>

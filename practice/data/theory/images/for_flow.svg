<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 220" preserveAspectRatio="xMinYMin meet">
  <defs>
    <style>
      .box{fill:#ffffff;stroke:#334155;stroke-width:2;rx:12;ry:12}
      .t{font:700 18px 'Segoe UI',sans-serif;fill:#0f172a}
      .s{font:600 14px 'Segoe UI',sans-serif;fill:#334155}
      .a{stroke:#0f766e;stroke-width:3;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#0f766e"/>
    </marker>
  </defs>

  <rect class="box" x="20" y="80" width="150" height="60"/>
  <text class="t" x="95" y="112" text-anchor="middle">초기화</text>

  <rect class="box" x="210" y="80" width="180" height="60"/>
  <text class="t" x="300" y="112" text-anchor="middle">조건 확인</text>

  <rect class="box" x="430" y="80" width="180" height="60"/>
  <text class="t" x="520" y="112" text-anchor="middle">본문 실행</text>

  <rect class="box" x="650" y="80" width="180" height="60"/>
  <text class="t" x="740" y="112" text-anchor="middle">증감</text>

  <line class="a" x1="170" y1="110" x2="205" y2="110"/>
  <line class="a" x1="390" y1="110" x2="425" y2="110"/>
  <line class="a" x1="610" y1="110" x2="645" y2="110"/>
  <path class="a" d="M 830 110 C 875 110, 875 35, 300 35 C 220 35, 220 72, 220 76"/>

  <text class="s" x="20" y="30">for문은 조건이 참이면: 조건 확인 → 본문 실행 → 증감 → 조건 확인 ... 을 반복합니다.</text>
  <text class="s" x="20" y="190">조건이 거짓이 되는 순간 반복이 종료됩니다.</text>
</svg>


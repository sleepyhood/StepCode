<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <defs><style>
  .t{font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;fill:#1f2937}
  .b{font-size:16px;font-weight:600}.s{font-size:14px}
  .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.accent{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.warn{fill:#fef2f2;stroke:#dc2626;stroke-width:2}
  </style></defs>
  <rect x="20" y="24" width="460" height="120" rx="12" class="accent"/>
  <text x="38" y="56" class="t b">4방향 벡터</text>
  <text x="38" y="84" class="t s">(-1,0) (1,0) (0,-1) (0,1)</text>
  <text x="38" y="110" class="t s">상/하/좌/우만 탐색한다.</text>
  <rect x="500" y="24" width="460" height="120" rx="12" class="accent"/>
  <text x="518" y="56" class="t b">8방향 벡터</text>
  <text x="518" y="84" class="t s">4방향 + 대각선 4개</text>
  <text x="518" y="110" class="t s">(-1,-1) ... (1,1), 단 (0,0) 제외 처리 필요</text>
  <rect x="20" y="170" width="940" height="170" rx="12" class="warn"/>
  <text x="38" y="202" class="t b">적용 순서</text>
  <text x="38" y="228" class="t s">1) 방향 집합을 먼저 고정한다.</text>
  <text x="38" y="254" class="t s">2) nx, ny 생성 후 경계 검사 -> 값 검사 순으로 진행한다.</text>
  <text x="38" y="280" class="t s">3) 유효 좌표만 재귀/스택에 넣는다.</text>
  <text x="38" y="306" class="t s">방향 수를 잘못 고르면 연결요소 수/누적값이 바뀐다.</text>
</svg>

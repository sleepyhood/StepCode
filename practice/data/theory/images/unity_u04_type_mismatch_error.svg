<svg width="650" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="650" height="200" fill="#1E1E1E" rx="8" />
  <rect width="650" height="30" fill="#333333" rx="8" />
  <circle cx="15" cy="15" r="6" fill="#FF5F56" />
  <circle cx="35" cy="15" r="6" fill="#FFBD2E" />
  <circle cx="55" cy="15" r="6" fill="#27C93F" />
  <text x="325" y="20" fill="#CCCCCC" font-family="monospace" font-size="12" text-anchor="middle">GameManager.cs - IDE</text>

  <text x="30" y="60" fill="#569CD6" font-family="monospace" font-size="14">string</text>
  <text x="85" y="60" fill="#9CDCFE" font-family="monospace" font-size="14">playerName =</text>
  <text x="180" y="60" fill="#CE9178" font-family="monospace" font-size="14">"Hero"</text><text x="230" y="60" fill="#D4D4D4" font-family="monospace" font-size="14">;</text>
  
  <text x="30" y="85" fill="#C586C0" font-family="monospace" font-size="14">if</text>
  <text x="55" y="85" fill="#D4D4D4" font-family="monospace" font-size="14">(playerName ==</text>
  <text x="175" y="85" fill="#B5CEA8" font-family="monospace" font-size="14">100</text>
  <text x="210" y="85" fill="#D4D4D4" font-family="monospace" font-size="14">)</text>
  
  <!-- Red squiggly line under == -->
  <path d="M 145 89 Q 148 93, 151 89 T 157 89" fill="none" stroke="#F44336" stroke-width="2" />
  
  <!-- Tooltip for error -->
  <rect x="70" y="115" width="530" height="40" fill="#252526" stroke="#454545" stroke-width="1" rx="4" />
  <text x="80" y="140" fill="#F44336" font-family="monospace" font-size="14">CS0019</text>
  <text x="135" y="140" fill="#CCCCCC" font-family="monospace" font-size="14">: Operator '==' cannot be applied to</text>
  <text x="80" y="163" fill="#CCCCCC" font-family="monospace" font-size="14">operands of type 'string' and 'int'</text>
</svg>

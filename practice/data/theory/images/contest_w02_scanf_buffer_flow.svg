<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">scanf 버퍼 소비 흐름</title>
  <desc id="desc">%d 뒤 %c에서 남은 개행이 먼저 읽히는 흐름과 공백을 둔 %c가 이를 건너뛰는 흐름을 비교한다.</desc>
  <style>
    text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #1f2937; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
    .accent { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 12; }
    .warn { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 12; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 12; }
    .t2 { font-size: 16px; font-weight: 700; }
    .t3 { font-size: 14px; }
    .line { stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
    .lineRed { stroke: #dc2626; stroke-width: 2; marker-end: url(#arrowRed); }
    .lineBlue { stroke: #0284c7; stroke-width: 2; marker-end: url(#arrowBlue); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/></marker>
  </defs>

  <rect x="26" y="20" width="300" height="90" class="accent" />
  <text x="176" y="50" text-anchor="middle" class="t2">입력 버퍼 초기 상태</text>
  <text x="176" y="74" text-anchor="middle" class="t3">7\nA\n</text>

  <rect x="364" y="20" width="260" height="90" class="box" />
  <text x="494" y="50" text-anchor="middle" class="t2">scanf("%d", &amp;n)</text>
  <text x="494" y="74" text-anchor="middle" class="t3">숫자 7 소비, 버퍼에 \nA\n 남음</text>

  <line x1="326" y1="65" x2="364" y2="65" class="line" />

  <rect x="662" y="20" width="292" height="90" class="warn" />
  <text x="808" y="50" text-anchor="middle" class="t2">scanf("%c", &amp;ch)</text>
  <text x="808" y="74" text-anchor="middle" class="t3">남은 첫 문자 '\n'을 바로 읽음</text>

  <line x1="624" y1="65" x2="662" y2="65" class="lineRed" />

  <rect x="26" y="150" width="450" height="176" class="warn" />
  <text x="46" y="178" class="t2">경로 A: "%d%c"</text>
  <text x="46" y="204" class="t3">1) %d가 숫자 토큰만 읽는다.</text>
  <text x="46" y="226" class="t3">2) 줄바꿈(\n)은 버퍼에 남는다.</text>
  <text x="46" y="248" class="t3">3) 다음 %c가 줄바꿈을 문자로 읽는다.</text>
  <text x="46" y="270" class="t3">4) 출력을 %d로 보면 줄바꿈 ASCII 값이 보인다.</text>

  <rect x="504" y="150" width="450" height="176" class="ok" />
  <text x="524" y="178" class="t2">경로 B: "%d %c" 또는 " %c"</text>
  <text x="524" y="204" class="t3">1) 공백이 버퍼의 공백/개행을 먼저 소비한다.</text>
  <text x="524" y="226" class="t3">2) 다음 실제 문자(A)를 읽는다.</text>
  <text x="524" y="248" class="t3">3) 문자 데이터 기준으로 출력이 안정된다.</text>
  <text x="524" y="270" class="t3">핵심: %c 앞 공백 유무가 버퍼 소비 규칙을 바꾼다.</text>

  <line x1="808" y1="110" x2="250" y2="150" class="lineRed" />
  <line x1="624" y1="92" x2="720" y2="150" class="lineBlue" />
</svg>

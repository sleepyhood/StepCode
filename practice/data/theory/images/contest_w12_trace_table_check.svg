<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <defs><style>
  .t{font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;fill:#1f2937}
  .b{font-size:16px;font-weight:600}.s{font-size:14px}
  .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.accent{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.warn{fill:#fef2f2;stroke:#dc2626;stroke-width:2}
  </style></defs>
  <rect x="20" y="24" width="940" height="92" rx="12" class="accent"/>
  <text x="38" y="58" class="t b">추적표 최소 열</text>
  <text x="38" y="84" class="t s">단계 | 조건 결과(참/거짓 근거) | 핵심 변수 값</text>
  <rect x="20" y="136" width="940" height="190" rx="12" class="box"/>
  <text x="38" y="168" class="t b">작성 순서</text>
  <text x="38" y="194" class="t s">1) 초기 상태 행을 먼저 작성한다.</text>
  <text x="38" y="220" class="t s">2) 반복 1회마다 값이 바뀐 행만 추가한다.</text>
  <text x="38" y="246" class="t s">3) 출력 직전 행을 별도 표시한다.</text>
  <text x="38" y="272" class="t s">4) 루프 횟수/경계 조건과 마지막 행 값을 교차 검산한다.</text>
  <rect x="520" y="176" width="420" height="130" rx="10" class="warn"/>
  <text x="538" y="208" class="t b">주의점</text>
  <text x="538" y="234" class="t s">중간 행 생략은 경계값 오판의 주원인이다.</text>
  <text x="538" y="260" class="t s">continue/break 발생 행은 반드시 따로 기록한다.</text>
</svg>

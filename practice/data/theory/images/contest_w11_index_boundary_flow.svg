<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320">
  <defs><style>
  .t{font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;fill:#1f2937}
  .b{font-size:16px;font-weight:600}.s{font-size:14px}
  .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.accent{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.warn{fill:#fef2f2;stroke:#dc2626;stroke-width:2}
  .line{stroke:#475569;stroke-width:2;marker-end:url(#m)}
  </style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect x="20" y="24" width="280" height="90" rx="12" class="box"/>
  <text x="38" y="56" class="t b">인덱스 역할 분리</text><text x="38" y="82" class="t s">i=행, j=열, k=누적축으로 고정한다.</text>
  <rect x="350" y="24" width="280" height="90" rx="12" class="accent"/>
  <text x="368" y="56" class="t b">경계 범위 확인</text><text x="368" y="82" class="t s">시작점/끝점이 배열 크기를 넘지 않는지 점검한다.</text>
  <rect x="680" y="24" width="280" height="90" rx="12" class="box"/>
  <text x="698" y="56" class="t b">누적식 계산</text><text x="698" y="82" class="t s">c[i][j] = Σ a[i][k]*b[k][j]</text>
  <line x1="302" y1="69" x2="348" y2="69" class="line"/><line x1="632" y1="69" x2="678" y2="69" class="line"/>
  <rect x="20" y="140" width="940" height="160" rx="12" class="warn"/>
  <text x="38" y="172" class="t b">오답 패턴</text>
  <text x="38" y="198" class="t s">- i/j/k를 바꿔 쓰면 전혀 다른 원소를 곱하게 된다.</text>
  <text x="38" y="224" class="t s">- 부분 정사각형 반복에서 &lt;= 대신 &lt; 를 쓰면 마지막 시작점을 놓친다.</text>
  <text x="38" y="250" class="t s">루틴: 크기 확인 -> 인덱스 고정 -> 누적식/경계식 검산 순으로 푼다.</text>
</svg>

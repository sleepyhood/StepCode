<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-labelledby="title desc">
  <title id="title">재귀-반복 치환 검산</title>
  <desc id="desc">자리수 합 재귀와 while 반복 분해가 같은 결과를 내는 교차 검산 절차를 보여준다.</desc>
  <style>
    text{font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;fill:#1f2937}
    .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:10}
    .accent{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:10}
    .ok{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:10}
    .warn{fill:#fee2e2;stroke:#dc2626;stroke-width:2;rx:10}
    .t2{font-size:16px;font-weight:700}.t3{font-size:14px}
  </style>

  <rect x="24" y="24" width="932" height="70" class="accent"/>
  <text x="44" y="52" class="t2">교차 검산: 재귀식과 반복식을 둘 다 계산해 결과를 대조한다</text>
  <text x="44" y="76" class="t3">예: f(a/10)+a%10 &lt;-&gt; while(a){sum+=a%10; a/=10;}</text>

  <rect x="24" y="112" width="300" height="176" class="box"/>
  <text x="44" y="140" class="t2">재귀식</text>
  <text x="44" y="166" class="t3">f(512)=f(51)+2</text>
  <text x="44" y="188" class="t3">=f(5)+1+2</text>
  <text x="44" y="210" class="t3">=f(0)+5+1+2 = 8</text>

  <rect x="352" y="112" width="300" height="176" class="ok"/>
  <text x="372" y="140" class="t2">반복식</text>
  <text x="372" y="166" class="t3">512 -> sum+=2</text>
  <text x="372" y="188" class="t3">51 -> sum+=1</text>
  <text x="372" y="210" class="t3">5 -> sum+=5, 결과 8</text>

  <rect x="680" y="112" width="276" height="176" class="warn"/>
  <text x="700" y="140" class="t2">오답 패턴</text>
  <text x="700" y="166" class="t3">- 한 경로만 계산하고 검산 생략</text>
  <text x="700" y="188" class="t3">- 나눗셈/나머지 적용 순서 혼동</text>
  <text x="700" y="210" class="t3">- 기저값(0) 반환 누락</text>
</svg>

<svg width="650" height="240" xmlns="http://www.w3.org/2000/svg">
  <rect width="650" height="240" fill="#2D2D30" rx="8" />
  
  <text x="325" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Translate와 Position의 차이</text>
  
  <!-- Translate section -->
  <rect x="20" y="50" width="300" height="170" fill="#1E1E1E" rx="4" stroke="#4CAF50" stroke-width="2"/>
  <text x="170" y="75" fill="#4CAF50" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">transform.Translate</text>
  <text x="170" y="95" fill="#CCCCCC" font-family="sans-serif" font-size="12" text-anchor="middle">"현재 위치에서 밀어주기"</text>
  
  <circle cx="80" cy="150" r="10" fill="#9CDCFE" />
  <text x="75" y="180" fill="#888888" font-family="sans-serif" font-size="10">출발</text>
  
  <path d="M 95 150 L 230 150" stroke="#4CAF50" stroke-width="3" fill="none" marker-end="url(#arrow-green)" stroke-dasharray="5,5"/>
  <circle cx="240" cy="150" r="10" fill="#4CAF50" />
  
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4CAF50" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F44336" />
    </marker>
  </defs>

  <!-- Position section -->
  <rect x="330" y="50" width="300" height="170" fill="#1E1E1E" rx="4" stroke="#F44336" stroke-width="2"/>
  <text x="480" y="75" fill="#F44336" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">transform.position = </text>
  <text x="480" y="95" fill="#CCCCCC" font-family="sans-serif" font-size="12" text-anchor="middle">"지정된 좌표로 순간 이동(텔레포트)"</text>
  
  <circle cx="380" cy="180" r="10" fill="#9CDCFE" />
  <circle cx="560" cy="130" r="10" fill="#F44336" />
  
  <path d="M 390 175 C 450 140, 500 120, 545 125" stroke="#F44336" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <text x="560" y="110" fill="#FFFFFF" font-family="sans-serif" font-size="10" text-anchor="middle">(10, 0, 5)</text>
</svg>

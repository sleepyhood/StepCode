<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">비트 마스크와 XOR 상쇄 흐름</title>
  <desc id="desc">AND 비트 마스크 계산과 XOR 누적에서 같은 값이 상쇄되는 규칙을 단계별로 보여준다.</desc>
  <style>
    text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #1f2937; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
    .accent { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 12; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 12; }
    .warn { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 12; }
    .t2 { font-size: 16px; font-weight: 700; }
    .t3 { font-size: 14px; }
    .line { stroke: #334155; stroke-width: 2; marker-end: url(#a); }
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker></defs>

  <rect x="24" y="22" width="300" height="120" class="accent"/>
  <text x="174" y="52" text-anchor="middle" class="t2">AND 마스크</text>
  <text x="174" y="78" text-anchor="middle" class="t3">14(1110) &amp; 10(1010)</text>
  <text x="174" y="100" text-anchor="middle" class="t3">= 1010(2) = 10</text>

  <rect x="356" y="22" width="300" height="120" class="ok"/>
  <text x="506" y="52" text-anchor="middle" class="t2">XOR 누적</text>
  <text x="506" y="78" text-anchor="middle" class="t3">x ^= a[i] 반복</text>
  <text x="506" y="100" text-anchor="middle" class="t3">같은 값 2회 등장 -> 상쇄</text>

  <rect x="688" y="22" width="268" height="120" class="box"/>
  <text x="822" y="52" text-anchor="middle" class="t2">핵심 성질</text>
  <text x="822" y="78" text-anchor="middle" class="t3">x ^ x = 0</text>
  <text x="822" y="100" text-anchor="middle" class="t3">a ^ 0 = a</text>

  <line x1="324" y1="82" x2="356" y2="82" class="line"/>
  <line x1="656" y1="82" x2="688" y2="82" class="line"/>

  <rect x="24" y="166" width="450" height="168" class="box"/>
  <text x="44" y="194" class="t2">XOR 추적표 예시</text>
  <text x="44" y="220" class="t3">배열: 1, 3, 1, 3, 1</text>
  <text x="44" y="242" class="t3">x=0 -> x^1=1 -> ^3=2 -> ^1=3 -> ^3=0 -> ^1=1</text>
  <text x="44" y="264" class="t3">최종: 1 (홀수 번 나온 값)</text>
  <text x="44" y="286" class="t3">규칙: 짝수 번 값은 상쇄, 홀수 번 값만 남는다.</text>

  <rect x="506" y="166" width="450" height="168" class="warn"/>
  <text x="526" y="194" class="t2">오답 패턴</text>
  <text x="526" y="220" class="t3">- XOR을 덧셈처럼 누적해 계산한다.</text>
  <text x="526" y="242" class="t3">- 비트 정렬 없이 십진수로만 추측한다.</text>
  <text x="526" y="264" class="t3">- 상쇄 성질을 놓쳐 반복 등장 값을 남긴다.</text>
</svg>

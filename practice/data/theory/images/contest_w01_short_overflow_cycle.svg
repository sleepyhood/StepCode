<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-labelledby="title desc">
  <title id="title">short 경계값 순환</title>
  <desc id="desc">short 타입의 최대값 다음에 최소값으로 순환되는 흐름과 int 계산/short 저장 구분을 보여준다.</desc>
  <defs>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #1f2937; }
      .small { font-size: 16px; }
      .body { font-size: 20px; font-weight: 600; }
      .cap { font-size: 15px; fill: #4b5563; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .accent { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; rx: 12; }
      .warn { fill: #fee2e2; stroke: #ef4444; stroke-width: 2; rx: 12; }
      .line { stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155" />
    </marker>
  </defs>

  <rect x="26" y="36" width="220" height="78" class="box" />
  <text x="136" y="78" text-anchor="middle" class="body">32766</text>
  <text x="136" y="102" text-anchor="middle" class="cap">short 범위 내부</text>

  <rect x="274" y="36" width="220" height="78" class="accent" />
  <text x="384" y="78" text-anchor="middle" class="body">32767</text>
  <text x="384" y="102" text-anchor="middle" class="cap">short 최대값</text>

  <rect x="522" y="36" width="220" height="78" class="warn" />
  <text x="632" y="78" text-anchor="middle" class="body">-32768</text>
  <text x="632" y="102" text-anchor="middle" class="cap">다음 저장 시 순환</text>

  <rect x="770" y="36" width="184" height="78" class="box" />
  <text x="862" y="78" text-anchor="middle" class="body">-32767</text>
  <text x="862" y="102" text-anchor="middle" class="cap">계속 증가 가능</text>

  <path d="M246 75 L274 75" class="line" />
  <path d="M494 75 L522 75" class="line" />
  <path d="M742 75 L770 75" class="line" />

  <rect x="40" y="170" width="420" height="118" class="box" />
  <text x="60" y="202" class="small">표현식 계산: <tspan font-weight="700">int</tspan> 로 계산</text>
  <text x="60" y="230" class="small">예) short s=32767;  s+1  -&gt; 32768</text>
  <text x="60" y="258" class="small">아직 short에 저장하지 않았으므로 순환이 일어나지 않음</text>

  <rect x="500" y="170" width="440" height="118" class="warn" />
  <text x="520" y="202" class="small">대입 저장: <tspan font-weight="700">short</tspan> 로 다시 저장</text>
  <text x="520" y="230" class="small">예) s = s + 1;  // 32768을 short로 저장</text>
  <text x="520" y="258" class="small">범위를 벗어나므로 -32768로 순환(2의 보수 표현)</text>
</svg>

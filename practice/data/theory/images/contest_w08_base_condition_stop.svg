<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-labelledby="title desc">
  <title id="title">재귀 기저 조건과 종료 시점</title>
  <desc id="desc">기저 조건이 호출 체인을 어디서 멈추는지와 반환 기준값이 전체 계산에 미치는 영향을 보여준다.</desc>
  <style>
    text{font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;fill:#1f2937}
    .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:10}
    .accent{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:10}
    .ok{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:10}
    .warn{fill:#fee2e2;stroke:#dc2626;stroke-width:2;rx:10}
    .t2{font-size:16px;font-weight:700}.t3{font-size:14px}
  </style>
  <rect x="24" y="24" width="932" height="70" class="accent"/>
  <text x="44" y="52" class="t2">핵심: 기저 조건은 "멈춤 지점"과 "첫 반환값"을 동시에 결정한다</text>
  <text x="44" y="76" class="t3">if(a==1) / if(a&lt;=1) 차이는 호출 경로와 결과값 모두를 바꾼다.</text>

  <rect x="24" y="112" width="300" height="176" class="box"/>
  <text x="44" y="140" class="t2">호출 하강</text>
  <text x="44" y="166" class="t3">f(5) -> f(4) -> f(3) -> ...</text>
  <text x="44" y="188" class="t3">기저 불만족이면 계속 하강</text>

  <rect x="352" y="112" width="300" height="176" class="ok"/>
  <text x="372" y="140" class="t2">기저 도달</text>
  <text x="372" y="166" class="t3">예: if(a==1) return 1;</text>
  <text x="372" y="188" class="t3">여기서 첫 반환값이 결정된다</text>

  <rect x="680" y="112" width="276" height="176" class="warn"/>
  <text x="700" y="140" class="t2">오답 패턴</text>
  <text x="700" y="166" class="t3">- 기저 조건 누락/불일치</text>
  <text x="700" y="188" class="t3">- a==1 과 a&lt;=1 혼동</text>
  <text x="700" y="210" class="t3">- 첫 반환값을 잘못 고정</text>
</svg>

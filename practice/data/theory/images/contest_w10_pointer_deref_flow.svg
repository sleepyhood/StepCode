<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <defs>
    <style>
      .t{font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;fill:#1f2937}
      .b{font-size:16px;font-weight:600}
      .s{font-size:14px}
      .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .accent{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
      .warn{fill:#fef2f2;stroke:#dc2626;stroke-width:2}
      .line{stroke:#475569;stroke-width:2;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  </defs>
  <rect x="20" y="24" width="280" height="90" rx="12" class="box"/>
  <text x="38" y="56" class="t b">포인터 값 확인</text>
  <text x="38" y="82" class="t s">p는 주소, *p는 해당 주소의 값이다.</text>

  <rect x="350" y="24" width="280" height="90" rx="12" class="accent"/>
  <text x="368" y="56" class="t b">인덱스 접근 해석</text>
  <text x="368" y="82" class="t s">link[c][i] == *(link[c] + i)</text>

  <rect x="680" y="24" width="280" height="90" rx="12" class="box"/>
  <text x="698" y="56" class="t b">읽기/쓰기 추적</text>
  <text x="698" y="82" class="t s">어느 칸을 읽고 쓰는지 표로 기록한다.</text>

  <line x1="302" y1="69" x2="348" y2="69" class="line"/>
  <line x1="632" y1="69" x2="678" y2="69" class="line"/>

  <rect x="20" y="150" width="940" height="180" rx="12" class="warn"/>
  <text x="38" y="182" class="t b">오답 패턴</text>
  <text x="38" y="208" class="t s">- 포인터 변수(p)와 실제 값(*p)을 같은 것으로 계산하면 인덱스가 어긋난다.</text>
  <text x="38" y="234" class="t s">- 주소 전달 함수에서 원본 값이 바뀌는 점을 놓치면 다음 연산이 전부 틀린다.</text>
  <text x="38" y="260" class="t s">- 배열 크기/유효 인덱스를 확인하지 않고 접근하면 추적이 끊긴다.</text>
  <text x="38" y="296" class="t s">루틴: 대상 주소 확인 -> 접근식 변환 -> 읽기/쓰기 시점 기록으로 푼다.</text>
</svg>

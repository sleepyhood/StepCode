<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <defs>
    <style>
      .t { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 16px; fill: #1f2937; }
      .box { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.5; rx: 10; }
      .cond { fill: #ecfeff; stroke: #06b6d4; stroke-width: 1.8; }
      .warn { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; rx: 8; }
      .arr { stroke: #374151; stroke-width: 2; marker-end: url(#arrow); fill: none; }
      .label { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 14px; fill: #111827; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="40" y="36" class="t">while True + break 종료 흐름: 조건을 먼저 검사하고, 참이면 즉시 종료합니다.</text>

  <rect x="70" y="70" width="180" height="56" class="box"/>
  <text x="120" y="104" class="t">초기값 설정</text>

  <rect x="360" y="70" width="220" height="56" class="cond"/>
  <text x="400" y="104" class="t">종료 조건 검사</text>

  <rect x="690" y="70" width="180" height="56" class="box"/>
  <text x="750" y="104" class="t">break 종료</text>

  <rect x="360" y="190" width="220" height="56" class="box"/>
  <text x="430" y="224" class="t">본문 실행</text>

  <rect x="690" y="190" width="180" height="56" class="box"/>
  <text x="720" y="224" class="t">값 업데이트</text>

  <path d="M250,98 L360,98" class="arr"/>
  <path d="M580,98 L690,98" class="arr"/>
  <path d="M470,126 L470,190" class="arr"/>
  <path d="M580,218 L690,218" class="arr"/>
  <path d="M780,190 L780,150 L470,150 L470,190" class="arr"/>

  <text x="610" y="87" class="label">참</text>
  <text x="482" y="162" class="label">거짓</text>

  <rect x="70" y="280" width="800" height="48" class="warn"/>
  <text x="92" y="311" class="t">핵심: break 조건 검사 위치(업데이트 전/후)에 따라 반복 횟수와 최종 출력이 달라집니다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <defs>
    <style>
      .t { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 16px; fill: #1f2937; }
      .stack { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.4; rx: 8; }
      .top { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.6; rx: 8; }
      .side { fill: #ecfeff; stroke: #06b6d4; stroke-width: 1.6; rx: 8; }
      .arr { stroke: #374151; stroke-width: 2; marker-end: url(#arrow); fill: none; }
      .mono { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 15px; fill: #111827; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="34" y="38" class="t">재귀 호출 스택과 호출 횟수 카운트: 함수 진입 시 a += 1이면 종료 호출도 포함됩니다.</text>

  <!-- stack frames -->
  <rect x="120" y="250" width="420" height="44" class="stack"/>
  <text x="144" y="278" class="mono">f(4) 진입  -> a=1</text>

  <rect x="120" y="206" width="420" height="44" class="stack"/>
  <text x="144" y="234" class="mono">f(3) 진입  -> a=2</text>

  <rect x="120" y="162" width="420" height="44" class="stack"/>
  <text x="144" y="190" class="mono">f(2) 진입  -> a=3</text>

  <rect x="120" y="118" width="420" height="44" class="top"/>
  <text x="144" y="146" class="mono">f(1) 진입  -> a=4, 종료 조건 만족 return</text>

  <path d="M560,272 L630,272 L630,140 L560,140" class="arr"/>
  <text x="642" y="176" class="t">복귀(return)</text>

  <rect x="620" y="108" width="300" height="156" class="side"/>
  <text x="644" y="142" class="t">예시 코드</text>
  <text x="644" y="170" class="t">a=0, f(4) 호출</text>
  <text x="644" y="198" class="t">진입 4회: f(4), f(3), f(2), f(1)</text>
  <text x="644" y="226" class="t">최종 a = 4</text>

  <rect x="120" y="306" width="800" height="34" class="stack"/>
  <text x="140" y="329" class="t">핵심: a += 1 위치가 종료조건 위에 있으면 마지막 호출도 카운트됩니다.</text>
</svg>

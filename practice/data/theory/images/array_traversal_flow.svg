<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300">
  <defs>
    <style>
      .title { font: 700 24px 'Segoe UI', sans-serif; fill: #1f2937; }
      .label { font: 600 16px 'Segoe UI', sans-serif; fill: #374151; }
      .mono { font: 700 16px 'Consolas', monospace; fill: #0f172a; }
      .small { font: 500 14px 'Segoe UI', sans-serif; fill: #4b5563; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="300" fill="#fff7ed"/>
  <text x="40" y="42" class="title">배열 순회 흐름</text>

  <rect x="80" y="110" width="120" height="70" rx="8" fill="#ffedd5" stroke="#fdba74"/>
  <rect x="210" y="110" width="120" height="70" rx="8" fill="#ffedd5" stroke="#fdba74"/>
  <rect x="340" y="110" width="120" height="70" rx="8" fill="#ffedd5" stroke="#fdba74"/>

  <text x="140" y="100" text-anchor="middle" class="mono">[0]</text>
  <text x="270" y="100" text-anchor="middle" class="mono">[1]</text>
  <text x="400" y="100" text-anchor="middle" class="mono">[2]</text>

  <text x="140" y="151" text-anchor="middle" class="mono">5</text>
  <text x="270" y="151" text-anchor="middle" class="mono">7</text>
  <text x="400" y="151" text-anchor="middle" class="mono">9</text>

  <line x1="140" y1="205" x2="270" y2="205" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="270" y1="205" x2="400" y2="205" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="140" y="235" text-anchor="middle" class="label">i=0 출력 5</text>
  <text x="270" y="235" text-anchor="middle" class="label">i=1 출력 7</text>
  <text x="400" y="235" text-anchor="middle" class="label">i=2 출력 9</text>

  <rect x="530" y="95" width="320" height="150" rx="10" fill="#ffffff" stroke="#fed7aa"/>
  <text x="550" y="125" class="mono">i = 0 -> arr[0] = 5</text>
  <text x="550" y="155" class="mono">i = 1 -> arr[1] = 7</text>
  <text x="550" y="185" class="mono">i = 2 -> arr[2] = 9</text>
  <text x="550" y="220" class="small">조건: 0 &lt;= i &lt; len(arr)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <defs>
    <style>
      .t { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 16px; fill: #1f2937; }
      .node { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.4; rx: 10; }
      .leaf { fill: #ecfeff; stroke: #06b6d4; stroke-width: 1.6; rx: 10; }
      .arr { stroke: #374151; stroke-width: 2; marker-end: url(#arrow); fill: none; }
      .ord { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 14px; fill: #111827; }
      .note { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.4; rx: 8; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="34" y="36" class="t">분할 재귀 호출 트리 (예: f(0,3), 리프에서 print): 출력 순서 번호를 리프에 표시</text>

  <rect x="430" y="58" width="120" height="42" class="node"/>
  <text x="462" y="84" class="t">f(0,3)</text>

  <rect x="250" y="132" width="120" height="42" class="node"/>
  <text x="282" y="158" class="t">f(0,1)</text>
  <rect x="610" y="132" width="120" height="42" class="node"/>
  <text x="642" y="158" class="t">f(2,3)</text>

  <path d="M465,100 L320,132" class="arr"/>
  <path d="M515,100 L660,132" class="arr"/>

  <rect x="160" y="214" width="100" height="42" class="leaf"/>
  <text x="194" y="240" class="t">0</text>
  <text x="165" y="268" class="ord">출력 #1</text>

  <rect x="340" y="214" width="100" height="42" class="leaf"/>
  <text x="374" y="240" class="t">1</text>
  <text x="345" y="268" class="ord">출력 #2</text>

  <rect x="520" y="214" width="100" height="42" class="leaf"/>
  <text x="554" y="240" class="t">2</text>
  <text x="525" y="268" class="ord">출력 #3</text>

  <rect x="700" y="214" width="100" height="42" class="leaf"/>
  <text x="734" y="240" class="t">3</text>
  <text x="705" y="268" class="ord">출력 #4</text>

  <path d="M280,174 L210,214" class="arr"/>
  <path d="M340,174 L390,214" class="arr"/>
  <path d="M640,174 L570,214" class="arr"/>
  <path d="M700,174 L750,214" class="arr"/>

  <rect x="130" y="300" width="720" height="40" class="note"/>
  <text x="152" y="326" class="t">핵심: 왼쪽 재귀를 먼저 호출하면 리프 출력 순서는 왼쪽에서 오른쪽으로 진행됩니다.</text>
</svg>

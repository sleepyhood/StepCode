<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <defs>
    <style>
      .t { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 16px; fill: #1f2937; }
      .g { fill: #ecfeff; stroke: #06b6d4; stroke-width: 1.8; rx: 10; }
      .l { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.5; rx: 10; }
      .warn { fill: #fee2e2; stroke: #ef4444; stroke-width: 1.5; rx: 10; }
      .arr { stroke: #374151; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="34" y="38" class="t">전역/지역 스코프 메모리 박스: 같은 이름이어도 대입 위치에 따라 다른 변수로 동작합니다.</text>

  <rect x="60" y="76" width="380" height="190" class="g"/>
  <text x="86" y="108" class="t">전역 영역 (module)</text>
  <text x="86" y="142" class="t">a = 3</text>
  <text x="86" y="176" class="t">def f(): ...</text>
  <text x="86" y="210" class="t">print(a)  # 함수 밖 출력</text>

  <rect x="540" y="76" width="380" height="190" class="l"/>
  <text x="566" y="108" class="t">함수 프레임 (local)</text>
  <text x="566" y="142" class="t">a = 9      # 지역 대입</text>
  <text x="566" y="176" class="t">print(a)   # 지역 값 출력</text>
  <text x="566" y="210" class="t">global a가 없으면 전역 a 변경 안 됨</text>

  <path d="M440,150 L540,150" class="arr"/>
  <text x="458" y="136" class="t">함수 호출</text>

  <rect x="60" y="286" width="860" height="48" class="warn"/>
  <text x="82" y="316" class="t">핵심: 함수 내부 대입이 있으면 기본은 지역 변수입니다. 전역 수정 시에는 global 선언이 필요합니다.</text>
</svg>

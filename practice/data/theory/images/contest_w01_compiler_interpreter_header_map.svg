<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-labelledby="title desc">
  <title id="title">컴파일러, 인터프리터, 헤더의 역할 비교</title>
  <desc id="desc">소스 코드가 컴파일러를 거쳐 실행 파일이 되는 흐름과 인터프리터 즉시 실행 흐름, 헤더가 제공하는 선언 묶음을 비교한다.</desc>
  <style>
    text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #1f2937; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
    .accent { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 12; }
    .warn { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 12; }
    .t1 { font-size: 20px; font-weight: 700; }
    .t2 { font-size: 16px; font-weight: 600; }
    .t3 { font-size: 14px; }
    .line { stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
    .line2 { stroke: #0284c7; stroke-width: 2; marker-end: url(#arrowBlue); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7" />
    </marker>
  </defs>

  <rect x="24" y="36" width="190" height="70" class="box" />
  <text x="119" y="68" text-anchor="middle" class="t2">고급 언어 소스 코드</text>
  <text x="119" y="92" text-anchor="middle" class="t3">예: C 소스(.c)</text>

  <rect x="270" y="28" width="220" height="88" class="accent" />
  <text x="380" y="60" text-anchor="middle" class="t2">컴파일러</text>
  <text x="380" y="84" text-anchor="middle" class="t3">소스 -> 목적 코드/실행 파일 번역</text>
  <text x="380" y="104" text-anchor="middle" class="t3">(번역 도구)</text>

  <rect x="558" y="28" width="200" height="88" class="box" />
  <text x="658" y="60" text-anchor="middle" class="t2">실행 파일</text>
  <text x="658" y="84" text-anchor="middle" class="t3">운영체제가 직접 실행</text>

  <line x1="214" y1="71" x2="270" y2="71" class="line" />
  <line x1="490" y1="71" x2="558" y2="71" class="line" />

  <rect x="270" y="164" width="220" height="88" class="warn" />
  <text x="380" y="196" text-anchor="middle" class="t2">인터프리터</text>
  <text x="380" y="220" text-anchor="middle" class="t3">코드를 읽으며 즉시 실행</text>
  <text x="380" y="240" text-anchor="middle" class="t3">(실행 방식/프로그램)</text>

  <rect x="558" y="164" width="200" height="88" class="box" />
  <text x="658" y="196" text-anchor="middle" class="t2">즉시 실행 결과</text>
  <text x="658" y="220" text-anchor="middle" class="t3">라인 단위 해석 가능</text>

  <line x1="214" y1="199" x2="270" y2="199" class="line" />
  <line x1="490" y1="199" x2="558" y2="199" class="line" />

  <rect x="786" y="84" width="170" height="168" class="box" />
  <text x="871" y="112" text-anchor="middle" class="t2">헤더(.h)</text>
  <text x="871" y="138" text-anchor="middle" class="t3">기능 선언 묶음</text>
  <text x="871" y="160" text-anchor="middle" class="t3">stdio.h: 입출력</text>
  <text x="871" y="180" text-anchor="middle" class="t3">stdarg.h: 가변 인자</text>
  <text x="871" y="200" text-anchor="middle" class="t3">time.h: 시간/날짜</text>
  <text x="871" y="220" text-anchor="middle" class="t3">assert.h: 단정 검사</text>

  <line x1="730" y1="71" x2="786" y2="110" class="line2" />
  <line x1="730" y1="199" x2="786" y2="225" class="line2" />

  <text x="24" y="298" class="t3">범례: 파랑 박스=번역 도구, 빨강 박스=즉시 실행 방식, 회색 박스=산출물/선언 묶음</text>
</svg>

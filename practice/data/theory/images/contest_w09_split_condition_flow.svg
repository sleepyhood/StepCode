<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <defs>
    <style>
      .t{font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;fill:#1f2937}
      .h{font-size:22px;font-weight:700}
      .b{font-size:16px;font-weight:600}
      .s{font-size:14px}
      .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .accent{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
      .warn{fill:#fef2f2;stroke:#dc2626;stroke-width:2}
      .arrow{stroke:#475569;stroke-width:2;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="20" y="24" width="220" height="90" rx="12" class="box"/>
  <text x="36" y="55" class="t b">1) 종료조건 먼저 확인</text>
  <text x="36" y="82" class="t s">if (a == b) 이면 리프 출력 후 종료</text>

  <rect x="270" y="24" width="300" height="90" rx="12" class="accent"/>
  <text x="286" y="55" class="t b">2) 분할점 계산</text>
  <text x="286" y="82" class="t s">c = (a+b)/2 또는 c = a+(b-a)/4</text>

  <rect x="600" y="24" width="360" height="90" rx="12" class="box"/>
  <text x="616" y="55" class="t b">3) 하위 구간 생성</text>
  <text x="616" y="82" class="t s">좌: (a, c), 우: (c+1, b)</text>

  <line x1="240" y1="69" x2="268" y2="69" class="arrow"/>
  <line x1="570" y1="69" x2="598" y2="69" class="arrow"/>

  <rect x="20" y="150" width="940" height="180" rx="12" class="warn"/>
  <text x="40" y="182" class="t b">오답 패턴 점검</text>
  <text x="40" y="212" class="t s">- 정수 나눗셈을 실수처럼 계산하면 분할 경계가 달라진다.</text>
  <text x="40" y="238" class="t s">- 종료조건 확인 전에 분할하면 같은 구간이 반복될 수 있다.</text>
  <text x="40" y="264" class="t s">- 좌/우 구간 인덱스(c, c+1)를 혼동하면 출력 순서가 틀어진다.</text>
  <text x="40" y="300" class="t s">루틴: 종료조건 -> 분할점 계산 -> 좌/우 구간 생성 순으로 추적한다.</text>
</svg>

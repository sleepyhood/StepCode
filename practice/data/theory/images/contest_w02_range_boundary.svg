<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300">
  <defs>
    <style>
      .h { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .t { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 16px; fill: #1f2937; }
      .axis { stroke: #374151; stroke-width: 2; }
      .tick { stroke: #6b7280; stroke-width: 1.5; }
      .pt { fill: #2563eb; }
      .off { fill: #ef4444; }
    </style>
  </defs>

  <text x="28" y="38" class="t">예시: range(2, 14, 3) -> 2, 5, 8, 11 (14는 포함되지 않음)</text>

  <line x1="70" y1="170" x2="900" y2="170" class="axis"/>

  <line x1="130" y1="158" x2="130" y2="182" class="tick"/><text x="123" y="205" class="t">2</text>
  <line x1="250" y1="158" x2="250" y2="182" class="tick"/><text x="243" y="205" class="t">5</text>
  <line x1="370" y1="158" x2="370" y2="182" class="tick"/><text x="363" y="205" class="t">8</text>
  <line x1="490" y1="158" x2="490" y2="182" class="tick"/><text x="478" y="205" class="t">11</text>
  <line x1="610" y1="158" x2="610" y2="182" class="tick"/><text x="598" y="205" class="t">14</text>

  <circle cx="130" cy="170" r="7" class="pt"/>
  <circle cx="250" cy="170" r="7" class="pt"/>
  <circle cx="370" cy="170" r="7" class="pt"/>
  <circle cx="490" cy="170" r="7" class="pt"/>
  <circle cx="610" cy="170" r="7" class="off"/>

  <text x="95" y="245" class="t">반복 횟수 = 4</text>
  <text x="235" y="245" class="t">포함 값: 2, 5, 8, 11</text>
  <text x="500" y="245" class="t">제외 값(stop): 14</text>
</svg>

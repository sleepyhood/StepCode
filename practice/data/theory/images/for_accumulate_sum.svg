<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280">
  <defs>
    <style>
      .title{font:700 18px 'Segoe UI',sans-serif;fill:#0f172a}
      .th{font:700 14px 'Segoe UI',sans-serif;fill:#0f172a}
      .td{font:600 14px 'Segoe UI',sans-serif;fill:#334155}
      .cell{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .head{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}
    </style>
  </defs>
  <text class="title" x="20" y="30">sum 누적 예시: sum = sum + i (i = 1..4)</text>

  <rect class="head" x="20" y="50" width="120" height="38"/>
  <rect class="head" x="140" y="50" width="120" height="38"/>
  <rect class="head" x="260" y="50" width="180" height="38"/>
  <rect class="head" x="440" y="50" width="160" height="38"/>
  <text class="th" x="80" y="75" text-anchor="middle">반복</text>
  <text class="th" x="200" y="75" text-anchor="middle">i</text>
  <text class="th" x="350" y="75" text-anchor="middle">계산</text>
  <text class="th" x="520" y="75" text-anchor="middle">sum</text>

  <rect class="cell" x="20" y="88" width="120" height="38"/><rect class="cell" x="140" y="88" width="120" height="38"/><rect class="cell" x="260" y="88" width="180" height="38"/><rect class="cell" x="440" y="88" width="160" height="38"/>
  <text class="td" x="80" y="113" text-anchor="middle">1</text><text class="td" x="200" y="113" text-anchor="middle">1</text><text class="td" x="350" y="113" text-anchor="middle">0 + 1</text><text class="td" x="520" y="113" text-anchor="middle">1</text>

  <rect class="cell" x="20" y="126" width="120" height="38"/><rect class="cell" x="140" y="126" width="120" height="38"/><rect class="cell" x="260" y="126" width="180" height="38"/><rect class="cell" x="440" y="126" width="160" height="38"/>
  <text class="td" x="80" y="151" text-anchor="middle">2</text><text class="td" x="200" y="151" text-anchor="middle">2</text><text class="td" x="350" y="151" text-anchor="middle">1 + 2</text><text class="td" x="520" y="151" text-anchor="middle">3</text>

  <rect class="cell" x="20" y="164" width="120" height="38"/><rect class="cell" x="140" y="164" width="120" height="38"/><rect class="cell" x="260" y="164" width="180" height="38"/><rect class="cell" x="440" y="164" width="160" height="38"/>
  <text class="td" x="80" y="189" text-anchor="middle">3</text><text class="td" x="200" y="189" text-anchor="middle">3</text><text class="td" x="350" y="189" text-anchor="middle">3 + 3</text><text class="td" x="520" y="189" text-anchor="middle">6</text>

  <rect class="cell" x="20" y="202" width="120" height="38"/><rect class="cell" x="140" y="202" width="120" height="38"/><rect class="cell" x="260" y="202" width="180" height="38"/><rect class="cell" x="440" y="202" width="160" height="38"/>
  <text class="td" x="80" y="227" text-anchor="middle">4</text><text class="td" x="200" y="227" text-anchor="middle">4</text><text class="td" x="350" y="227" text-anchor="middle">6 + 4</text><text class="td" x="520" y="227" text-anchor="middle">10</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <defs>
    <style>
      .t { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 16px; fill: #1f2937; }
      .h { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .n { stroke: #374151; stroke-width: 2; }
      .tick { stroke: #6b7280; stroke-width: 1.5; }
      .box { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.5; rx: 8; }
      .ok { fill: #ecfeff; stroke: #06b6d4; stroke-width: 1.5; rx: 8; }
      .pt { fill: #2563eb; }
    </style>
  </defs>

  <text x="32" y="40" class="t">관계식: a = b * (a // b) + (a % b), b &gt; 0 이면 0 &lt;= (a % b) &lt; b</text>

  <line x1="60" y1="180" x2="920" y2="180" class="n"/>

  <line x1="100" y1="168" x2="100" y2="192" class="tick"/><text x="90" y="214" class="t">-15</text>
  <line x1="200" y1="168" x2="200" y2="192" class="tick"/><text x="190" y="214" class="t">-10</text>
  <line x1="300" y1="168" x2="300" y2="192" class="tick"/><text x="295" y="214" class="t">-5</text>
  <line x1="400" y1="168" x2="400" y2="192" class="tick"/><text x="395" y="214" class="t">0</text>
  <line x1="500" y1="168" x2="500" y2="192" class="tick"/><text x="495" y="214" class="t">5</text>

  <circle cx="340" cy="180" r="6" class="pt"/><text x="314" y="158" class="t">a = -13</text>
  <circle cx="440" cy="180" r="6" class="pt"/><text x="424" y="158" class="t">나머지 = 2</text>

  <rect x="60" y="240" width="390" height="90" class="box"/>
  <text x="80" y="275" class="t">-13 // 5 = -3</text>
  <text x="80" y="300" class="t">-13 % 5  = 2</text>

  <rect x="490" y="240" width="430" height="90" class="ok"/>
  <text x="510" y="275" class="t">검산: 5 * (-3) + 2 = -13</text>
  <text x="510" y="300" class="t">나머지 범위 [0, 5)에서 2는 유효</text>
</svg>

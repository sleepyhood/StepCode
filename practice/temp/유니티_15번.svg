<!--?xml version="1.0" encoding="UTF-8"?-->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900">
  <defs>
    <!-- Background grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#2f2f2f"></rect>
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3a3a3a" stroke-width="1"></path>
    </pattern>

    <!-- Subtle shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.55"></feDropShadow>
    </filter>

    <!-- Gradients -->
    <linearGradient id="gradEntry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8a3b"></stop>
      <stop offset="1" stop-color="#0e5e27"></stop>
    </linearGradient>

    <linearGradient id="gradIdle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d28a2e"></stop>
      <stop offset="1" stop-color="#a46311"></stop>
    </linearGradient>

    <linearGradient id="gradState" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f646a"></stop>
      <stop offset="1" stop-color="#45494f"></stop>
    </linearGradient>

    <linearGradient id="gradExit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d23a3a"></stop>
      <stop offset="1" stop-color="#8f1717"></stop>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowWhite" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e6e6e6"></path>
    </marker>

    <marker id="arrowYellow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f0b400"></path>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="900" fill="url(#grid)"></rect>

  <!-- Connectors (under nodes) -->
  <!-- Entry -> Idle -->
  <path d="M 500 100 L 500 150" stroke="#f0b400" stroke-width="4" fill="none" marker-end="url(#arrowYellow)"></path>

  <!-- Idle -> Slow/Fast Jump -->
  <path d="M 420 230 L 300 270" stroke="#dcdcdc" stroke-width="3" fill="none" marker-end="url(#arrowWhite)"></path>
  <path d="M 580 230 L 700 270" stroke="#dcdcdc" stroke-width="3" fill="none" marker-end="url(#arrowWhite)"></path>

  <!-- Slow/Fast Jump -> Center -->
  <path d="M 310 360 L 420 410" stroke="#dcdcdc" stroke-width="3" fill="none" marker-end="url(#arrowWhite)"></path>
  <path d="M 690 360 L 580 410" stroke="#dcdcdc" stroke-width="3" fill="none" marker-end="url(#arrowWhite)"></path>

  <!-- Center -> Left/Right fall states -->
  <path d="M 420 500 L 300 540" stroke="#dcdcdc" stroke-width="3" fill="none" marker-end="url(#arrowWhite)"></path>
  <path d="M 580 500 L 700 540" stroke="#dcdcdc" stroke-width="3" fill="none" marker-end="url(#arrowWhite)"></path>

  <!-- Left fall -> Slow Land -->
  <path d="M 270 630 L 270 660" stroke="#dcdcdc" stroke-width="3" fill="none" marker-end="url(#arrowWhite)"></path>

  <!-- Right fall -> Right land -->
  <path d="M 730 630 L 730 660" stroke="#dcdcdc" stroke-width="3" fill="none" marker-end="url(#arrowWhite)"></path>

  <!-- Slow Land / Right land -> Exit -->
  <path d="M 310 750 L 440 800" stroke="#dcdcdc" stroke-width="3" fill="none" marker-end="url(#arrowWhite)"></path>
  <path d="M 690 750 L 560 800" stroke="#dcdcdc" stroke-width="3" fill="none" marker-end="url(#arrowWhite)"></path>

  <!-- Nodes -->
  <!-- Entry -->
  <g filter="url(#shadow)">
    <rect x="330" y="40" rx="10" ry="10" width="340" height="60" fill="url(#gradEntry)" stroke="#0a3d19" stroke-width="2"></rect>
    <text x="500" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#0b1a0f">Entry</text>
  </g>

  <!-- Idle -->
  <g filter="url(#shadow)">
    <rect x="280" y="150" rx="10" ry="10" width="440" height="80" fill="url(#gradIdle)" stroke="#6e3d06" stroke-width="2"></rect>
    <text x="500" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#2b1604">Idle</text>
  </g>

  <!-- Slow Jump -->
  <g filter="url(#shadow)">
    <rect x="70" y="270" rx="10" ry="10" width="420" height="90" fill="url(#gradState)" stroke="#2c2f33" stroke-width="2"></rect>
    <text x="140" y="325" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1e1f22">Slow Jump</text>
  </g>

  <!-- Fast Jump -->
  <g filter="url(#shadow)">
    <rect x="510" y="270" rx="10" ry="10" width="420" height="90" fill="url(#gradState)" stroke="#2c2f33" stroke-width="2"></rect>
    <text x="580" y="325" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1e1f22">Fast Jump</text>
  </g>

  <!-- Center (blank label) -->
  <g filter="url(#shadow)">
    <rect x="280" y="410" rx="10" ry="10" width="440" height="90" fill="url(#gradState)" stroke="#2c2f33" stroke-width="2"></rect>
    <!-- white placeholder -->
    <rect x="370" y="430" rx="6" ry="6" width="260" height="50" fill="#ffffff" stroke="#7fd3ff" stroke-width="2" stroke-dasharray="4 3"></rect>
  </g>

  <!-- Left fall (blank) -->
  <g filter="url(#shadow)">
    <rect x="70" y="540" rx="10" ry="10" width="420" height="90" fill="url(#gradState)" stroke="#2c2f33" stroke-width="2"></rect>
    <rect x="130" y="560" rx="6" ry="6" width="300" height="50" fill="#ffffff" stroke="#7fd3ff" stroke-width="2" stroke-dasharray="4 3"></rect>
  </g>

  <!-- Right fall (blank) -->
  <g filter="url(#shadow)">
    <rect x="510" y="540" rx="10" ry="10" width="420" height="90" fill="url(#gradState)" stroke="#2c2f33" stroke-width="2"></rect>
    <rect x="570" y="560" rx="6" ry="6" width="300" height="50" fill="#ffffff" stroke="#7fd3ff" stroke-width="2" stroke-dasharray="4 3"></rect>
  </g>

  <!-- Slow Land -->
  <g filter="url(#shadow)">
    <rect x="70" y="660" rx="10" ry="10" width="420" height="90" fill="url(#gradState)" stroke="#2c2f33" stroke-width="2"></rect>
    <text x="150" y="715" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1e1f22">Slow Land</text>
  </g>

  <!-- Right land (blank) -->
  <g filter="url(#shadow)">
    <rect x="510" y="660" rx="10" ry="10" width="420" height="90" fill="url(#gradState)" stroke="#2c2f33" stroke-width="2"></rect>
    <rect x="600" y="680" rx="6" ry="6" width="240" height="50" fill="#ffffff" stroke="#7fd3ff" stroke-width="2" stroke-dasharray="4 3"></rect>
  </g>

  <!-- Exit -->
  <g filter="url(#shadow)">
    <rect x="350" y="800" rx="10" ry="10" width="300" height="70" fill="url(#gradExit)" stroke="#4b0b0b" stroke-width="2"></rect>
    <text x="500" y="845" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#2a0505">Exit</text>
  </g>
</svg>
